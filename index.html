<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B45">
<title>MotoJá — Mototáxi</title>
<link rel="manifest" id="manifestLink" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" id="appleIcon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
  /* App do piloto: ?app=piloto (ou piloto.html) abre direto na área do piloto, com ícone e nome próprios */
  window.APP_PILOTO = new URLSearchParams(location.search).get('app') === 'piloto';
  if (window.APP_PILOTO){
    document.getElementById('manifestLink').href = 'manifest-piloto.json';
    document.getElementById('appleIcon').href = 'apple-touch-icon-piloto.png';
    document.title = 'MotoJá Piloto';
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F3F5EF; --sup:#FFFFFF; --sup2:#F7F9F5; --tinta:#15231C; --cinza:#5B6961; --linha:#DCE3DA; --linha-forte:#C5D0C6;
  --cana:#0E6B45; --cana-esc:#0A5135; --cana-bg:#E3F0E8;
  --sinal:#FFB400; --sinal-bg:#FFF4D6; --sinal-sombra:rgba(255,180,0,.28);
  --fita-rosa:#E3245A; --fita-azul:#2364D2;
  --ok-ink:#127A47; --danger-ink:#B4302A; --warn-ink:#8A5A00; --info-ink:#1D5BB8;
  --text:var(--tinta); --muted:var(--cinza); --line:var(--linha); --brand:var(--cana); --panel:var(--sup); --panel2:var(--sup2); --bg:var(--papel);
  --r-sheet:26px; --r-card:16px; --r-ctl:12px;
  --sombra:0 1px 2px rgba(21,35,28,.06),0 6px 18px rgba(21,35,28,.08);
  --f-disp:'Bricolage Grotesque',system-ui,sans-serif; --f-txt:'Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#E7ECE4;color:var(--tinta);font-family:var(--f-txt);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sinal);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* moldura do app */
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--papel);position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--linha),0 20px 60px rgba(21,35,28,.12)}
.fitas{display:block;height:5px;background:linear-gradient(90deg,var(--cana) 0 25%,var(--sinal) 25% 50%,var(--fita-rosa) 50% 75%,var(--fita-azul) 75% 100%)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--sup);border-bottom:1px solid var(--linha);z-index:10}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:-.035em;color:var(--tinta)}
.brand b{color:var(--cana);font-weight:800}
.brand.com-marca{gap:12px}
.elogo-img{object-fit:contain;background:#fff;border:1px solid var(--linha);padding:3px;border-radius:12px}
.marca-txt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.marca-nome{font-family:var(--f-disp);font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--tinta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.via{display:flex;align-items:center;gap:4px;font-family:var(--f-txt);font-size:10.5px;font-weight:700;color:var(--cinza);letter-spacing:0;margin-top:3px}
.via span{font-weight:700}
.marca.mini{width:12px!important;height:12px!important}
.hero-logo{position:absolute;left:50%;bottom:-48px;transform:translateX(-50%);background:#fff;border-radius:28px;padding:6px;box-shadow:0 0 0 5px var(--papel),var(--sombra)}
.hero-logo .elogo,.hero-logo .elogo-img{border:0;border-radius:22px;font-size:30px}
.hero-via{text-align:center;margin-top:58px;font-size:12px;color:var(--cinza);font-weight:700}
.marca{width:30px;height:30px;flex:none;display:block}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sup2);color:var(--cinza);border:1px solid var(--linha);white-space:nowrap}
.badge.ok{color:var(--ok-ink);border-color:#BFE0CC;background:#EEF7F1}
.badge.warn{color:var(--warn-ink);border-color:#F1DBA6;background:#FFF8E6}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--linha);background:var(--sup);display:grid;place-items:center;cursor:pointer;font-size:15px;color:var(--cinza)}
.iconbtn:hover{border-color:var(--linha-forte)}
#contaBtn{border:2px solid var(--cana)}
#contaBtn img{width:100%;height:100%;object-fit:cover}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.view.active{display:block}
#view-passageiro{overflow:hidden}

/* navegação inferior */
nav.bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sup);border-top:1px solid var(--linha);padding:6px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;z-index:10}
nav.bottom button{background:none;border:0;border-radius:14px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--cinza);font-size:12.5px;font-weight:700;cursor:pointer;position:relative}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--cana);background:var(--cana-bg)}
nav.bottom .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--fita-rosa);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 6px;border:2px solid var(--sup)}

/* mapa */
.map{position:absolute;inset:0;touch-action:none;background:#E8EDE6;overflow:hidden;z-index:0}
.leaflet-container{background:#E8EDE6;font-family:var(--f-txt);cursor:crosshair}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.8)!important}
.map .leaflet-top.leaflet-right{top:38%}
.leaflet-bar{border:0!important;box-shadow:var(--sombra)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{background:var(--sup);color:var(--tinta);border-color:var(--linha)!important;width:38px!important;height:38px!important;line-height:38px!important}
.lmk{background:none;border:0}
.mk-o{width:28px;height:28px;transform:translateY(50%);display:grid;place-items:center}
.mk-o span{width:18px;height:18px;border-radius:50%;background:var(--cana);border:3px solid #fff;box-shadow:0 0 0 6px rgba(14,107,69,.22),0 2px 6px rgba(0,0,0,.3)}
.mk-d svg{display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.mk-m{width:42px;height:42px;border-radius:50%;background:var(--tinta);border:4px solid var(--c);display:grid;place-items:center;font-size:19px;transform:translateY(50%);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 28%,transparent),0 4px 10px rgba(0,0,0,.3)}
.mk-m.sm{width:30px;height:30px;border-width:3px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mk-me{width:16px;height:16px;border-radius:50%;background:var(--fita-azul);border:3px solid #fff;transform:translateY(50%);box-shadow:0 0 0 8px rgba(35,100,210,.2)}

/* busca (origem/destino) */
.searchCard{position:absolute;top:12px;left:12px;right:12px;background:var(--sup);border-radius:20px;padding:6px;z-index:6;box-shadow:0 2px 4px rgba(21,35,28,.06),0 12px 32px rgba(21,35,28,.16)}
.field{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;cursor:pointer;border:1.5px solid transparent}
.field.active{background:var(--sup2);border-color:var(--cana)}
.field .lbl{font-size:12px;font-weight:700;color:var(--cinza)}
.field .val{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .val.ph{color:#8A968F;font-weight:400}
.field input{background:none;border:0;outline:0;width:100%;font-size:15px;font-weight:700;padding:0}
.field input::placeholder{color:#8A968F;font-weight:400}
.field .grow{flex:1;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.o{background:var(--cana);box-shadow:0 0 0 4px var(--cana-bg)}
.dot.d{background:var(--sinal);border-radius:3px;box-shadow:0 0 0 4px var(--sinal-bg)}
.xbtn{background:var(--sup2);border:1px solid var(--linha);border-radius:99px;width:28px;height:28px;font-size:12px;cursor:pointer;color:var(--cinza);flex:none}
.sep{height:1px;background:var(--linha);margin:0 12px 0 36px}
.gpsbtn{background:var(--cana-bg);color:var(--cana);border:0;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;flex:none}
.sugs{max-height:240px;overflow:auto;border-top:1px solid var(--linha);margin-top:4px;padding-top:4px}
.sug{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:15px}
.sug:hover,.sug.hl{background:var(--sup2)}
.sug small{color:var(--cinza);display:block;font-size:12.5px}

/* painel inferior (sheet) */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--sup);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:6px 18px 18px;z-index:5;box-shadow:0 -8px 30px rgba(21,35,28,.14);transition:max-height .25s}
.sheet.min{max-height:96px;overflow:hidden}
.grabzone{padding:6px 0 4px;cursor:pointer}
.grab{width:44px;height:5px;background:var(--linha-forte);border-radius:5px;margin:0 auto 10px}

/* tipografia */
h2{font-family:var(--f-disp);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
h3{font-family:var(--f-disp);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.muted{color:var(--cinza)}
.small{font-size:13.5px}
.eta{font-family:var(--f-disp);font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.1}

/* utilidades de layout */
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:12px}.mt2{margin-top:22px}.mb{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column;gap:10px}
.hr{height:1px;background:var(--linha);margin:16px 0}
.pad{padding:14px}

/* botões */
.btn{background:var(--cana);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s;text-decoration:none;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn:hover{background:var(--cana-esc)}
.btn:active{transform:scale(.985)}
.btn.block{width:100%}
.btn.ghost{background:var(--sup);color:var(--tinta);border:1.5px solid var(--linha-forte);box-shadow:none}
.btn.ghost:hover{background:var(--sup2)}
.btn.danger{background:#FCEDEC;color:var(--danger-ink);border:1.5px solid #F2C9C6;box-shadow:none}
.btn.ok{background:var(--cana);color:#fff}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.gbtn{background:#fff;color:#1F1F1F;border:1.5px solid var(--linha-forte)}
.gbtn:hover{background:#F6F7F6}
.linkbtn{background:none;border:0;color:var(--cana);font-weight:700;font-size:14px;cursor:pointer;padding:6px}
.chip{border:1.5px solid var(--linha);background:var(--sup);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--tinta)}
.chip:hover{border-color:var(--linha-forte)}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}

/* opções de empresa */
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-card);border:1.5px solid var(--linha);background:var(--sup);cursor:pointer}
.opt.on{border-color:var(--cana);background:var(--cana-bg)}
.opt.off{opacity:.6}
.opt .price{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:-.02em;margin-left:auto;text-align:right}
.elogo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:#fff;flex:none;font-size:15px;text-shadow:0 1px 1px rgba(0,0,0,.25)}

/* formulários */
.input{width:100%;background:var(--sup);border:1.5px solid var(--linha-forte);border-radius:var(--r-ctl);padding:12px 13px;font-size:15px;outline:0;color:var(--tinta)}
.input:focus{border-color:var(--cana);box-shadow:0 0 0 3px var(--cana-bg)}
.input::placeholder{color:#93A098}
textarea.input{font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#5B6961 50%),linear-gradient(135deg,#5B6961 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:var(--tinta)}
label.f > span{font-weight:400;color:var(--cinza);font-size:12.5px}
.photoUp{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--linha-forte);border-radius:var(--r-card);cursor:pointer;background:var(--sup2)}
.photoUp img{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--sup);border:3px solid var(--cana)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors label{display:flex;align-items:center;gap:6px;padding:7px 11px;border:1.5px solid var(--linha);border-radius:99px;cursor:pointer;font-size:13px;font-weight:700;color:var(--tinta);background:var(--sup)}
.colors input{display:none}
.colors label:has(input:checked){border-color:var(--cana);background:var(--cana-bg)}
.colors em{font-style:normal}
.switch{width:54px;height:32px;border-radius:99px;background:#C9D2CB;position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--cana)}
.switch.on::after{left:25px}

/* cartões e listas */
.card{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r-card);padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:11px 12px}
.stat b{font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--cinza)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dash .stat{padding:14px}
.dash .stat b{font-size:24px}
.bar{height:8px;border-radius:8px;background:var(--sup2);border:1px solid var(--linha);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cana);border-radius:8px}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--sup2);border:2px solid var(--linha)}
.avatar.lg{width:74px;height:74px;border:3px solid var(--cana)}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sup2);border:1px solid var(--linha);color:var(--cinza)}
.tag.on{color:var(--ok-ink);border-color:#BFE0CC;background:#EEF7F1}
.tag.y{color:var(--warn-ink);border-color:#F1DBA6;background:var(--sinal-bg)}
.tag.r{color:var(--danger-ink);border-color:#F2C9C6;background:#FCEDEC}
.tag.b{color:var(--info-ink);border-color:#C7D8F3;background:#EEF4FD}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block;flex:none}
/* placa padrão Mercosul */
.plate{display:inline-flex;flex-direction:column;align-items:center;background:#fff;color:#111;font-weight:800;letter-spacing:.1em;padding:0 10px 3px;border-radius:5px;border:1.5px solid #1b1b1b;font-size:16px;font-family:var(--f-disp);line-height:1.2;overflow:hidden}
.plate::before{content:'BRASIL';display:block;width:calc(100% + 20px);background:#1C4CA8;color:#fff;font-size:7px;letter-spacing:.25em;text-align:center;padding:1px 0;margin:0 -10px 2px;font-family:var(--f-txt)}
.tabs{display:flex;gap:6px;padding:12px 14px;position:sticky;top:0;background:var(--papel);z-index:3;border-bottom:1px solid var(--linha);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:1 0 auto;text-align:center;white-space:nowrap}
.empty{text-align:center;padding:30px 18px;color:var(--cinza);border:1.5px dashed var(--linha-forte);border-radius:var(--r-card);background:var(--sup)}
.empty b{color:var(--tinta);font-family:var(--f-disp);font-size:17px;font-weight:700}
.empty .big{font-size:28px;width:64px;height:64px;border-radius:50%;background:var(--cana-bg);display:grid;place-items:center;margin:0 auto 12px}
.note{font-size:13.5px;color:var(--tinta);background:var(--sinal-bg);border:1px solid #F1DBA6;border-radius:var(--r-ctl);padding:11px 13px}
.spinner{width:54px;height:54px;border-radius:50%;border:4px solid var(--cana-bg);border-top-color:var(--cana);animation:spin 1s linear infinite;margin:6px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.driver{display:flex;gap:14px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--cinza)}
.kv dd{font-weight:700}
.trip{display:flex;flex-direction:column;gap:9px;font-size:14px}
.trip div{display:flex;gap:10px;align-items:center}
.stars{display:flex;justify-content:center;gap:4px}
.stars button{background:none;border:0;font-size:32px;cursor:pointer;filter:grayscale(1);opacity:.35}
.stars button.on{filter:none;opacity:1}
.pmapwrap{position:relative;height:260px;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--linha);margin:0 14px}
.pmapwrap .map{border-radius:var(--r-card)}

/* oferta de corrida tocando no piloto */
.oferta{border:2px solid var(--sinal)!important;background:linear-gradient(var(--sinal-bg),var(--sup) 70%)!important;box-shadow:0 0 0 5px var(--sinal-sombra)!important}

/* login / cadastro */
.authview{position:absolute;inset:0;z-index:8;background:var(--papel);overflow:auto}
.authhero{position:relative;height:170px;background:var(--cana)}
.authhero > svg:first-child{position:absolute;inset:0;width:100%;height:100%;display:block}
.authhero > svg.marca{position:absolute;left:50%;bottom:-36px;transform:translateX(-50%);width:80px;height:80px;background:var(--sup);border-radius:24px;padding:10px;box-shadow:0 0 0 5px var(--papel),var(--sombra)}
.authcard{max-width:420px;margin:0 auto;padding:50px 20px 34px}
.authlogo{display:none}
.or{display:flex;align-items:center;gap:10px;color:var(--cinza);font-size:13px;margin:18px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--linha)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sup2);border:1px solid var(--linha);border-radius:14px;padding:4px;margin-bottom:18px}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--cinza)}
.seg button.on{background:var(--sup);color:var(--tinta);box-shadow:0 1px 3px rgba(21,35,28,.15)}
.authErr{background:#FCEDEC;color:var(--danger-ink);border:1px solid #F2C9C6;border-radius:12px;padding:10px 12px;font-size:14px}

/* modal, aviso, carregando */
.modal{position:fixed;inset:0;background:rgba(21,35,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.modal.hidden{display:none}
.modal-card{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--sup);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:20px 18px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media(min-width:600px){.modal{align-items:center}.modal-card{border-radius:var(--r-sheet)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.splash{position:absolute;inset:0;display:grid;place-items:center;background:var(--papel);z-index:40}
#destAC{min-height:24px}
#destAC gmp-place-autocomplete{width:100%}
a.btn{text-decoration:none}

/* ============ DASHBOARDS ============ */
.boletim{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--cana) 0%,var(--cana-esc) 100%);color:#fff;border-radius:22px;padding:16px 16px 14px;box-shadow:var(--sombra);isolation:isolate}
.boletim::after{content:"";position:absolute;z-index:-1;right:-70px;top:70px;width:150px;height:260px;transform:rotate(28deg);opacity:.55;
  background:linear-gradient(90deg,transparent 0 18px,var(--fita-rosa) 18px 34px,transparent 34px 46px,var(--sinal) 46px 62px,transparent 62px 74px,var(--fita-azul) 74px 90px,transparent 90px)}
.bol-top{display:flex;flex-direction:column;gap:10px}
.bol-tit{font-family:var(--f-disp);font-weight:700;font-size:15px;opacity:.85}
.perchips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:rgba(0,0,0,.18);border-radius:99px;padding:3px;width:max-content;max-width:100%}
.perchips::-webkit-scrollbar{display:none}
.perchips button{border:0;background:transparent;color:inherit;font:700 13px var(--f-txt);padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;opacity:.85}
.perchips button.on{background:#fff;color:var(--cana-esc);opacity:1}
.perchips button:focus-visible,.ordchips button:focus-visible,.prow:focus-visible{outline:3px solid var(--sinal);outline-offset:2px}
.perchips:not(.boletim .perchips){background:var(--sup2);border:1px solid var(--linha);color:var(--tinta)}
.perchips:not(.boletim .perchips) button.on{background:var(--tinta);color:#fff}
.bol-main{margin-top:18px}
.bol-lab{display:block;font-size:13px;opacity:.85}
.bol-val{display:block;font-family:var(--f-disp);font-weight:800;font-size:clamp(38px,11vw,56px);letter-spacing:-.04em;line-height:1;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.bol-cmp{font-size:12.5px;opacity:.9}
.delta{display:inline-block;font-weight:800;font-size:12px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.18)}
.delta.up{background:#fff;color:var(--ok-ink)}
.delta.down{background:#fff;color:var(--danger-ink)}
.bol-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;margin-top:16px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.18)}
.bol-kpis > div{background:rgba(0,0,0,.16);padding:10px 12px;backdrop-filter:blur(2px)}
.bol-kpis b{display:block;font-family:var(--f-disp);font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bol-kpis span{font-size:12px;opacity:.85}
.boletim.mini{padding:14px}.boletim.mini .bol-main{margin-top:0}.boletim.mini .bol-val{font-size:38px}
.minikpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.minikpis > div{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:10px 12px}
.minikpis b{display:block;font-family:var(--f-disp);font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.minikpis b small{font-size:13px;color:var(--cinza);font-weight:700}
.minikpis span{font-size:12px;color:var(--cinza)}
.c-ok{color:var(--ok-ink)}.c-info{color:var(--info-ink)}.c-danger{color:var(--danger-ink)}
.ordchips{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--cinza);flex-wrap:wrap}
.ordchips button{border:1.5px solid var(--linha);background:var(--sup);border-radius:99px;padding:5px 11px;font:700 12.5px var(--f-txt);color:var(--tinta);cursor:pointer}
.ordchips button.on{background:var(--cana-bg);border-color:var(--cana);color:var(--cana-esc)}
/* tabela de pilotos */
.ptab{display:flex;flex-direction:column}
.ptab-h{display:none}
.prow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto auto;grid-template-areas:"pos quem n v" "bar bar bar bar";gap:4px 10px;align-items:center;padding:12px 4px 10px;border-top:1px solid var(--linha);border-radius:10px}
.prow:hover{background:var(--sup2)}
.ppos{grid-area:pos;font-family:var(--f-disp);font-weight:800;color:var(--cinza);text-align:center}
.ppos.top{color:var(--cana)}
.pquem{grid-area:quem;display:flex;gap:10px;align-items:center;min-width:0}
.pav{position:relative;flex:none}.pav .avatar{width:40px;height:40px}
.pst{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#AAB5AD;border:2px solid #fff}
.pst.on{background:#1FA463}.pst.b{background:var(--fita-azul)}
.pnome{display:flex;flex-direction:column;min-width:0}
.pnome b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnome small{font-size:12px;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnum{font-weight:700;font-size:14px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow > .pnum:nth-of-type(1){grid-area:n}
.pnum.big{font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.pnum.big small{font:600 11px var(--f-txt);color:var(--cinza);letter-spacing:0}
.prow > .pnum:not(.big):not(.dk){grid-area:v;min-width:82px}
.pnum.dk{display:none}
.pbarra{grid-area:bar;height:5px;border-radius:5px;background:var(--sup2);overflow:hidden;margin-left:32px}
.pbarra i{display:block;height:100%;background:var(--cana);border-radius:5px;transition:width .4s}
/* gráfico */
.graf{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;height:180px;margin-top:14px;align-items:stretch}
.graf.vazio{display:grid;place-items:center;height:120px;color:var(--cinza);font-size:13px;border:1.5px dashed var(--linha);border-radius:12px}
.gcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.gtrack{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.gcol i{display:block;width:100%;max-width:34px;background:var(--cana-bg);border:1px solid color-mix(in srgb,var(--cana) 30%,transparent);border-bottom:0;border-radius:5px 5px 1px 1px;flex:none}
.gcol.atual i{background:var(--cana);border-color:var(--cana)}
.gcol:hover i{background:color-mix(in srgb,var(--cana) 60%,#fff)}
.gval{font-size:11px;font-weight:800;color:var(--cana-esc);white-space:nowrap;height:16px}
.glab{font-size:10.5px;color:var(--cinza);height:16px;margin-top:4px;white-space:nowrap}
/* pagamentos */
.pagbar{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px}
.pagbar i{display:block;height:100%}
.paglist{display:flex;flex-direction:column;margin-top:10px}
.paglist > div{display:grid;grid-template-columns:12px 1fr auto auto 40px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--linha);font-size:14px}
.paglist > div:first-child{border-top:0}
.paglist b{font-variant-numeric:tabular-nums}.paglist .small:last-child{text-align:right}
/* viagens por dia */
.dia{margin-bottom:14px}
.dia header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 2px;font-size:13.5px;position:sticky;top:0;background:var(--papel);z-index:1}
.modal-card .dia header{background:var(--sup)}
.dia header > b{font-family:var(--f-disp);font-size:15px}
.dia header > b::first-letter{text-transform:uppercase}
.dia header span{color:var(--cinza)}.dia header span b{color:var(--tinta)}
.viagem{background:var(--sup);border:1px solid var(--linha);border-radius:14px;margin-top:6px}
.viagem summary{list-style:none;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 12px;cursor:pointer}
.viagem summary::-webkit-details-marker{display:none}
.viagem[open]{border-color:var(--cana);box-shadow:0 0 0 3px var(--cana-bg)}
.vh{font-family:var(--f-disp);font-weight:700;font-size:14px;color:var(--cinza);font-variant-numeric:tabular-nums}
.vrota{display:flex;flex-direction:column;min-width:0}
.vrota b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrota small,.vval small{font-size:12px;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vval{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--f-disp);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.vval small{font-family:var(--f-txt);font-weight:400}
.viagem.off .vrota b{color:var(--cinza)}
.vdet{padding:0 12px 14px;border-top:1px dashed var(--linha);padding-top:12px;margin:0 0 0}
.mb-only{display:block}
.pnome small.mb-only{white-space:normal}
@media (min-width: 960px){
  .boletim{padding:22px 24px 18px}
  .bol-top{flex-direction:row;justify-content:space-between;align-items:center}
  .bol-kpis{grid-template-columns:repeat(4,1fr)}
  .boletim::after{right:10px;width:200px;height:300px;top:78px;opacity:.75}
  .minikpis{grid-template-columns:repeat(4,1fr)}
  .mb-only{display:none!important}
  .ptab-h{display:grid;grid-template-columns:28px minmax(200px,1.6fr) 70px 110px 100px 80px 70px 70px;gap:10px;padding:0 6px 8px;font-size:12px;color:var(--cinza);font-weight:700}
  .ptab-h span:nth-child(n+3){text-align:right}
  .prow{grid-template-columns:28px minmax(200px,1.6fr) 70px 110px 100px 80px 70px 70px;grid-template-areas:none;padding:10px 6px;gap:6px 10px}
  .prow > *{grid-area:auto!important}
  .pnum.dk{display:block;color:var(--cinza);font-weight:600}
  .pbarra{grid-column:2 / -1!important;margin-left:50px}
  #pilotTop .minikpis{grid-template-columns:repeat(4,1fr)}
}

/* ============ COMPUTADOR / TABLET ============ */
.dashcards{display:block}
@media (min-width: 960px){
  html,body{background:var(--papel)}
  #app{max-width:none;box-shadow:none;display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto auto 1fr}
  #app.semnav{grid-template-columns:1fr}
  .fitas{grid-column:1/-1}
  header.top{grid-column:1/-1;padding:12px 28px}
  .brand{font-size:24px}
  main{grid-column:2;grid-row:3;min-height:0}
  #app.semnav main{grid-column:1}
  /* navegação vira barra lateral */
  nav.bottom{grid-column:1;grid-row:3;display:flex!important;flex-direction:column;justify-content:flex-start;gap:4px;padding:18px 14px;border-top:0;border-right:1px solid var(--linha)}
  #app.semnav nav.bottom{display:none!important}
  nav.bottom button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:15px;border-radius:12px}
  nav.bottom button:hover{background:var(--sup2)}
  nav.bottom button.on{background:var(--cana-bg)}
  nav.bottom .cnt{position:static;margin-left:auto}

  /* passageiro: mapa inteiro + painel lateral */
  .searchCard{top:20px;left:20px;right:auto;width:400px}
  .sheet{left:20px;right:auto;width:400px;top:206px;bottom:auto;max-height:calc(100% - 226px);border-radius:22px;padding:18px 20px 20px;box-shadow:0 2px 4px rgba(21,35,28,.06),0 12px 32px rgba(21,35,28,.16)}
  .sheet.min{max-height:calc(100% - 226px);overflow:auto}
  .grabzone{display:none}
  .map .leaflet-top.leaflet-right{top:20px}

  /* piloto: duas colunas */
  #view-piloto.active{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start;column-gap:24px;padding:24px 28px;max-width:1280px;margin:0 auto}
  #pilotTop{grid-column:1;grid-row:1/3;padding:0!important}
  #view-piloto.active.aba-extra{display:block;max-width:900px}
  #view-piloto.aba-extra #pilotTop{padding:0!important}
  #pilotMapWrap{grid-column:2;grid-row:1;height:380px;margin:0!important}
  #pilotBottom{grid-column:2;grid-row:2;padding:0 0 24px!important}
  #pilotMapWrap[style*="none"] + #pilotBottom{grid-row:1/3}
  #pilotMapWrap + #pilotBottom{margin-top:16px}

  /* master: conteúdo largo em grade */
  .tabs{padding:16px 28px;max-width:none}
  .tabs .chip{flex:0 0 auto;padding:9px 18px}
  #admBody{padding:22px 28px 40px!important;max-width:1280px}
  #admBody > .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start}
  .dash{grid-template-columns:repeat(4,1fr)}
  #pilotTop .dash{grid-template-columns:1fr 1fr}
  .dashcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .dashcards > .card.mt{margin-top:14px}
  .stats{max-width:720px}

  /* entrada: capa ao lado do formulário */
  .authview{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(420px,1fr)}
  .authhero{height:auto;min-height:100%}
  .authhero > svg.marca{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:40px;padding:18px}
  .hero-logo{top:50%;bottom:auto;transform:translate(-50%,-50%)}
  .hero-logo .elogo,.hero-logo .elogo-img{width:150px!important;height:150px!important}
  .hero-via{display:none}
  .marca-nome{max-width:40vw}
  .authcard{align-self:center;padding:40px 48px;max-width:500px;width:100%}

  .modal-card{max-width:620px}
  #toast{bottom:32px}
}
@media (min-width: 600px) and (max-width: 959px){
  #app{max-width:720px}
  .searchCard,.sheet{left:50%;right:auto;width:min(560px, calc(100% - 24px));transform:translateX(-50%)}
}
</style>
</head>
<body>
<div id="app">
  <span class="fitas" aria-hidden="true"></span>
  <header class="top">
    <div class="brand"><svg class="marca" viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="mhd"><rect width="32" height="32" rx="9"/></clipPath></defs><g clip-path="url(#mhd)"><rect width="32" height="32" fill="#0E6B45"/><g transform="rotate(-24 16 16)"><rect x="7" y="-6" width="4.6" height="44" fill="#FFB400"/><rect x="13.7" y="-6" width="4.6" height="44" fill="#E3245A"/><rect x="20.4" y="-6" width="4.6" height="44" fill="#2364D2"/></g></g></svg><span>Moto<b>Já</b></span></div>
    <div class="row" style="gap:8px"><span id="syncBadge" class="badge">carregando…</span><button class="iconbtn" id="contaBtn" data-act="conta" aria-label="Minha conta" style="display:none;padding:0;overflow:hidden"></button><button class="iconbtn" data-act="setup" aria-label="Configurações">⚙️</button></div>
  </header>
  <main>
    <section id="view-passageiro" class="view active">
      <div class="map" id="passMap"></div>
      <div class="searchCard" id="searchCard">
        <div class="field" id="fOrig" data-act="field" data-f="origem">
          <span class="dot o"></span>
          <div class="grow"><div class="lbl">Sua localização</div><div class="val ph" id="origTxt">Toque no mapa ou use o GPS</div></div>
          <button class="gpsbtn" id="gpsBtn" data-act="gps">📡 GPS</button>
          <button class="xbtn" id="xOrig" data-act="clear" data-f="origem" style="display:none" aria-label="Limpar origem">✕</button>
        </div>
        <div class="sep"></div>
        <div class="field" id="fDest" data-act="field" data-f="destino">
          <span class="dot d"></span>
          <div class="grow"><div class="lbl">Para onde?</div><div id="destAC"><div class="val ph">Carregando busca…</div></div><div class="val" id="destTxt" style="display:none"></div></div>
          <button class="xbtn" id="xDest" data-act="clear" data-f="destino" style="display:none" aria-label="Limpar destino">✕</button>
        </div>
        <div class="sugs" id="sugs" style="display:none"></div>
      </div>
      <div class="sheet" id="sheet"><div class="grabzone" data-act="sheetToggle"><div class="grab"></div></div><div id="sheetBody"></div></div>
    </section>
    <section id="view-piloto" class="view">
      <div id="pilotTop" style="padding:14px 14px 0"></div>
      <div class="pmapwrap" id="pilotMapWrap" style="display:none;margin-top:12px"><div class="map" id="pilotMap"></div></div>
      <div id="pilotBottom" style="padding:12px 14px 24px"></div>
    </section>
    <section id="view-master" class="view">
      <div class="tabs" id="admTabs"></div>
      <div id="admBody" style="padding:14px 14px 28px"></div>
    </section>
    <div class="authview" id="authView" style="display:none"></div>
    <div class="splash" id="splash"><div style="text-align:center"><div class="spinner"></div><div class="muted small">Carregando MotoJá…</div></div></div>
  </main>
  <nav class="bottom" id="nav" style="display:none">
    <button data-act="nav" data-v="passageiro" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>Passageiro</button>
    <button data-act="nav" data-v="piloto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M5.5 16.5h6l3.5-7h2.5l1.5 7"/><path d="M9 9.5h4"/></svg>Piloto<span class="cnt" id="pilotCnt" style="display:none"></span></button>
    <button data-act="nav" data-v="master"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"/></svg>Master</button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast"></div>
<script type="module">
/* =====================================================================
   CONFIGURAÇÃO — preencha aqui (ou pela tela "Configurar" do próprio app)
   ===================================================================== */
const CONFIG = {
  // Chave da Google Maps Platform (APIs: Maps JavaScript, Places (New), Routes, Geocoding)

  SUGESTOES_REGIAO: ['Tracunhaém', 'Buenos Aires', 'Vicência', 'Carpina', 'Aliança', 'Lagoa do Carro', 'Lagoa de Itaenga', 'Paudalho', 'Timbaúba', 'Condado', 'Itaquitinga', 'Goiana', 'Glória do Goitá', 'Macaparana'],
  // Configuração do Firebase (Firestore) para compartilhar dados entre celulares.
  // Deixe null para salvar só no aparelho (bom para testar).
  // E-mails com acesso ao painel MASTER (precisam bater com as regras do Firestore)
  MASTERS: ['islandeicaro12@gmail.com'],
  FIREBASE: {
    apiKey: "AIzaSyBWpmiPdZzGkbIBPiKp2RfRMXsKgAK6jXg",
    authDomain: "motoja-mototaxi.firebaseapp.com",
    projectId: "motoja-mototaxi",
    storageBucket: "motoja-mototaxi.firebasestorage.app",
    messagingSenderId: "11800988424",
    appId: "1:11800988424:web:45c7e3aec8fd4c5196fabd"
  }
  // Exemplo:
  // FIREBASE: { apiKey: "...", authDomain: "seu-projeto.firebaseapp.com", projectId: "seu-projeto", appId: "..." }

const hexRgb = h => { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h.slice(0, 6), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbHex = (r, g, b) => '#' + [r, g, b].map(x => Math.round(clamp(x, 0, 255)).toString(16).padStart(2, '0')).join('');
const lum = ([r, g, b]) => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
const contraste = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const misturar = (c, d, t) => c.map((v, i) => v + (d[i] - v) * t);
/* cor primária com contraste bom para texto branco nos botões */
function paletaDe(cor){
  let c = hexRgb(safeColor(cor)); let i = 0;
  while (contraste(c, [255, 255, 255]) < 4.5 && i++ < 30) c = misturar(c, [0, 0, 0], .08);
  return {pri:rgbHex(...c), esc:rgbHex(...misturar(c, [0, 0, 0], .25)), bg:rgbHex(...misturar(c, [255, 255, 255], .88)), borda:rgbHex(...misturar(c, [255, 255, 255], .7))};
}
/* lê a imagem da logo: reduz, mantém transparência e descobre a cor dominante */
function lerLogo(file){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 320, s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * s)), hh = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = hh; const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, hh);
      let cor = null;
      try{
        const d = cx.getImageData(0, 0, w, hh).data; const baldes = {};
        for (let i = 0; i < d.length; i += 16){
          const [r, g, b, a] = [d[i], d[i + 1], d[i + 2], d[i + 3]]; if (a < 200) continue;
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b); if (mx - mn < 40 || mx < 40 || mn > 225) continue;
          const k = [r >> 5, g >> 5, b >> 5].join(','); (baldes[k] = baldes[k] || {n:0, r:0, g:0, b:0}); baldes[k].n++; baldes[k].r += r; baldes[k].g += g; baldes[k].b += b;
        }
        const top = Object.values(baldes).sort((a, b) => b.n - a.n)[0];
        if (top) cor = rgbHex(top.r / top.n, top.g / top.n, top.b / top.n);
      }catch(e){}
      let data = cv.toDataURL('image/webp', .9); if (!data.startsWith('data:image/webp')) data = cv.toDataURL('image/png');
      URL.revokeObjectURL(url); res({data, cor});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; img.src = url;
  });
}

function hav(a, b){ const t = x => x * Math.PI / 180; const dLat = t(b.lat - a.lat), dLng = t(b.lng - a.lng);
  const s = Math.sin(dLat/2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLng/2) ** 2; return 2 * 6371000 * Math.asin(Math.sqrt(s)); }
const encPath = p => p.map(x => (+x.lat).toFixed(5) + ',' + (+x.lng).toFixed(5)).join('|');
const decPath = s => !s ? [] : String(s).split('|').map(t => { const [a, b] = t.split(',').map(Number); return {lat:a, lng:b}; }).filter(p => isFinite(p.lat) && isFinite(p.lng));
const pathLen = p => p.reduce((s, x, i) => i ? s + hav(p[i-1], x) : 0, 0);
function pointAt(p, d){
  if (!p.length) return null;
  for (let i = 1; i < p.length; i++){ const l = hav(p[i-1], p[i]); if (d <= l){ const t = l ? d / l : 0; return {lat:p[i-1].lat + (p[i].lat - p[i-1].lat) * t, lng:p[i-1].lng + (p[i].lng - p[i-1].lng) * t}; } d -= l; }
  return p[p.length - 1];
}
function offsetPoint(p, m, ang){ return {lat:p.lat + m * Math.cos(ang) / 111320, lng:p.lng + m * Math.sin(ang) / (111320 * Math.cos(p.lat * Math.PI / 180))}; }
function thin(p, max = 180){ if (p.length <= max) return p; const step = (p.length - 1) / (max - 1); const o = []; for (let i = 0; i < max; i++) o.push(p[Math.round(i * step)]); return o; }
const ll = p => ({lat:+p.lat, lng:+p.lng});

let lastNomi = 0;
async function nominatim(url){

  lastNomi = Date.now();
  const r = await fetch(url, {headers:{'Accept-Language':'pt-BR'}}); if (!r.ok) throw new Error('nominatim ' + r.status); return r.json();
}
async function osrmRoute(a, b){
  const u = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
  const r = await fetch(u); if (!r.ok) throw new Error('osrm ' + r.status);
  const j = await r.json(); const rt = j.routes && j.routes[0]; if (!rt) throw new Error('sem rota');
  const path = rt.geometry.coordinates.map(c => ({lat:c[1], lng:c[0]}));
  return {path:thin(path), distM:rt.distance, durS:rt.duration * 0.85};
}

async function calcRoute(a, b){
  a = ll(a); b = ll(b);
  if (MODE === 'osm'){ try{ return await osrmRoute(a, b); }catch(e){ console.warn('OSRM', e); } const d = hav(a, b) * 1.3; return {path:[a, b], distM:d, durS:d / SPEED, aprox:true}; }
  try{
    const { Route } = await google.maps.importLibrary('routes');
    for (const travelMode of ['TWO_WHEELER', 'DRIVING']){
      try{
        const { routes } = await Route.computeRoutes({ origin:a, destination:b, travelMode, fields:['path', 'distanceMeters', 'durationMillis'] });
        const r = routes && routes[0];
        if (r && r.path && r.path.length){
          const path = r.path.map(p => ({lat:typeof p.lat === 'function' ? p.lat() : p.lat, lng:typeof p.lng === 'function' ? p.lng() : p.lng}));
          const distM = r.distanceMeters || pathLen(path);
          return {path:thin(path), distM, durS:r.durationMillis ? r.durationMillis / 1000 : distM / SPEED};
        }
      }catch(e){ console.warn('Routes', travelMode, e); }
    }
  }catch(e){ console.warn('Routes library', e); }
  const d = hav(a, b) * 1.3;
  return {path:[a, b], distM:d, durS:d / SPEED, aprox:true};
}

async function addressOf(p){

      const a = j.address || {};

      const txt = [j.name && j.name !== a.road ? j.name : '', rua, a.suburb || a.city_district, a.city || a.town || a.village].filter(Boolean).join(' - ');
      if (txt) return txt;
    }catch(e){ console.warn('Nominatim', e); }
    return `Ponto marcado (${(+p.lat).toFixed(5)}, ${(+p.lng).toFixed(5)})`;
  }
  try{
    if (!geocoder){ const { Geocoder } = await google.maps.importLibrary('geocoding'); geocoder = new Geocoder(); }
    const { results } = await geocoder.geocode({ location:ll(p) });

}

class GMap{

  async init(center){

    const o = {center:ll(center), zoom:15, mapId:CFG.mapId, disableDefaultUI:true, zoomControl:true, gestureHandling:'greedy', clickableIcons:false};
    if (google.maps.ColorScheme) o.colorScheme = google.maps.ColorScheme.DARK;

    const main = dashed
      ? new P({map:this.map, path, strokeOpacity:0, zIndex:2, icons:[{icon:{path:'M 0,-1 0,1', strokeOpacity:1, strokeColor:color, scale:3}, offset:'0', repeat:'12px'}]})

  fit(points, pad){

  areas(list){
    const sig = JSON.stringify(list.map(c => [c.lat, c.lng, c.raioKm])); if (this._asig === sig) return; this._asig = sig;

/* Mapa OpenStreetMap (Leaflet) com a mesma interface */
class LMap{
  constructor(el, opts = {}){ this.el = el; this.opts = opts; this.markers = {}; this.lines = {}; this.ready = false; }
  async init(center){
    await loadLeaflet();
    this.map = L.map(this.el, {zoomControl:false, attributionControl:true}).setView([center.lat, center.lng], 15);
    L.control.zoom({position:'topright'}).addTo(this.map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(this.map);
    if (this.opts.onTap) this.map.on('click', e => this.opts.onTap({lat:e.latlng.lat, lng:e.latlng.lng}));
    setTimeout(() => this.map.invalidateSize(), 200);
    this.ready = true; return this;
  }
  marker(key, pos, html, z = 1){
    let m = this.markers[key];
    if (!pos){ if (m){ m.remove(); delete this.markers[key]; } return; }
    const icon = () => L.divIcon({className:'lmk', html:`<div style="transform:translate(-50%,-100%);width:max-content">${html}</div>`, iconSize:[0, 0]});
    if (!m){ m = L.marker([pos.lat, pos.lng], {icon:icon(), zIndexOffset:z * 100, interactive:false}).addTo(this.map); m._html = html; this.markers[key] = m; }
    if (m._html !== html){ m.setIcon(icon()); m._html = html; }
    m.setLatLng([pos.lat, pos.lng]);
  }
  line(key, path, color = corMarca(), dashed = false){
    let l = this.lines[key];
    if (!path || path.length < 2){ if (l){ l.forEach(x => x.remove()); delete this.lines[key]; } return; }
    const sig = encPath(path) + color + dashed; if (l && l._sig === sig) return;
    if (l) l.forEach(x => x.remove());
    const pts = path.map(p => [p.lat, p.lng]);
    l = [L.polyline(pts, {color:'#ffffff', opacity:.95, weight:10, interactive:false}).addTo(this.map),
         L.polyline(pts, {color, weight:5, opacity:1, dashArray:dashed ? '2 12' : null, lineCap:'round', interactive:false}).addTo(this.map)];
    l._sig = sig; this.lines[key] = l;
  }
  keep(keys){
    for (const k of Object.keys(this.markers)) if (!keys.includes(k)) this.marker(k, null);
    for (const k of Object.keys(this.lines)) if (!keys.includes(k)) this.line(k, null);
  }
  fit(points, pad){
    points = points.filter(Boolean).map(ll); if (!points.length || !this.map) return;
    if (points.length === 1 || points.every(p => hav(p, points[0]) < 30)){ this.map.setView([points[0].lat, points[0].lng], 16); return; }
    const b = L.latLngBounds(points.map(p => [p.lat, p.lng]));
    const P = typeof pad === 'number' || !pad ? {top:pad || 40, bottom:pad || 40, left:pad || 40, right:pad || 40} : pad;
    this.map.fitBounds(b, {paddingTopLeft:[P.left, P.top], paddingBottomRight:[P.right, P.bottom], maxZoom:17});
  }
  areas(list){
    const sig = JSON.stringify(list.map(c => [c.lat, c.lng, c.raioKm])); if (this._asig === sig) return; this._asig = sig;
    (this._areas || []).forEach(a => a.remove());
    this._areas = list.map(c => L.circle([+c.lat, +c.lng], {radius:num(c.raioKm, 10) * 1000, color:corMarca(), weight:1.5, dashArray:'6 8', fillColor:corMarca(), fillOpacity:.05, interactive:false}).addTo(this.map));
  }
  panTo(p){ this.map.panTo([p.lat, p.lng]); }
  center(){ const c = this.map.getCenter(); return {lat:c.lat, lng:c.lng}; }
  onIdle(fn){ this.map.on('moveend', fn); }
}
const makeMap = (el, opts) => MODE === 'osm' ? new LMap(el, opts) : new GMap(el, opts);

/* ================= armazenamento (Firebase Firestore ou local) ================= */
const Store = {
  mode:'local', fs:null, db:null, ls:{},
  async init(){
    if (!CFG.firebase) return;
    try{
      const V = '10.12.2';
      const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
      this.fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
      const fbApp = app.initializeApp(CFG.firebase); this.appMod = app; this.fbApp = fbApp;
      this.db = this.fs.getFirestore(fbApp);
      try{ this.authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`); this.auth = this.authMod.getAuth(fbApp); this.auth.languageCode = 'pt'; }
      catch(e){ console.error('auth', e); this.auth = null; }
      this.mode = 'cloud';
    }catch(e){ console.error(e); toast('Não consegui conectar ao Firebase — usando dados locais.'); }
  },
  key: c => 'mt_' + c,
  readLocal(c){ return LS.get(this.key(c), {}); },
  notify(c){ (this.ls[c] || []).forEach(f => f()); },
  subscribe(c, cb, filter){
    if (this.mode === 'cloud'){
      const { collection, onSnapshot, query, where } = this.fs;
      const ref = filter ? query(collection(this.db, c), where(filter[0], '==', filter[1])) : collection(this.db, c);
      return onSnapshot(ref, s => { setSync('ok'); cb(s.docs.map(d => ({...d.data(), id:d.id}))); },
        e => { console.error(c, e); setSync('warn', e.code === 'permission-denied' ? 'sem permissão' : 'erro ao sincronizar'); });
    }
    const fire = () => cb(Object.values(this.readLocal(c)).filter(x => !filter || x[filter[0]] === filter[1]));
    (this.ls[c] = this.ls[c] || []).push(fire); fire();
    return () => { this.ls[c] = (this.ls[c] || []).filter(f => f !== fire); };
  },
  async run(fn){
    try{ return await fn(); }
    catch(e){ console.error(e); toast(e && e.code === 'permission-denied' ? 'Sem permissão para salvar (regras do Firestore).' : 'Não foi possível salvar. Tente de novo.'); throw e; }
  },
  async set(c, id, data){
    const {id:_, ...body} = data;
    if (this.mode === 'cloud'){ const { doc, setDoc } = this.fs; return this.run(() => setDoc(doc(this.db, c, id), clean(body))); }
    const all = this.readLocal(c); all[id] = {...clean(body), id}; LS.set(this.key(c), all); this.notify(c);
  },
  async update(c, id, p){
    if (this.mode === 'cloud'){ const { doc, updateDoc } = this.fs; return this.run(() => updateDoc(doc(this.db, c, id), clean(p))); }
    const all = this.readLocal(c); if (!all[id]) return; all[id] = {...all[id], ...clean(p)}; LS.set(this.key(c), all); this.notify(c);
  },
  async del(c, id){
    if (this.mode === 'cloud'){ const { doc, deleteDoc } = this.fs; return this.run(() => deleteDoc(doc(this.db, c, id))); }
    const all = this.readLocal(c); delete all[id]; LS.set(this.key(c), all); this.notify(c);
  },
  /* aceita a corrida só se ainda estiver "procurando" (evita dois pilotos na mesma corrida) */
  async claim(id, p, check){
    const ok = d => d && d.status === 'procurando' && (!check || check(d));
    if (this.mode === 'cloud'){
      const { doc, runTransaction } = this.fs; const ref = doc(this.db, 'corridas', id);
      try{
        await runTransaction(this.db, async tx => { const s = await tx.get(ref); if (!s.exists() || !ok(s.data())) throw new Error('taken'); tx.update(ref, clean(p)); });
        return true;
      }catch(e){ if (e.message === 'taken') return false; toast('Não foi possível aceitar. Tente de novo.'); throw e; }
    }
    const all = this.readLocal('corridas'); if (!all[id] || !ok(all[id])) return false;
    all[id] = {...all[id], ...clean(p)}; LS.set(this.key('corridas'), all); this.notify('corridas'); return true;
  },
  /* transação genérica: fn(dadosAtuais) devolve o patch ou null para não alterar */
  async tx(c, id, fn){
    if (this.mode === 'cloud'){
      const { doc, runTransaction } = this.fs; const ref = doc(this.db, c, id); let out = null;
      try{ await runTransaction(this.db, async tx => { const s = await tx.get(ref); const patch = fn(s.exists() ? s.data() : null); out = patch; if (patch) tx.update(ref, clean(patch)); }); return out; }
      catch(e){ console.warn('tx', e); return null; }
    }
    const all = this.readLocal(c); const patch = fn(all[id] ? {...all[id]} : null); if (!patch) return null;
    all[id] = {...all[id], ...clean(patch)}; LS.set(this.key(c), all); this.notify(c); return patch;
  }
};

const S = {

const pil = id => S.pilotos.find(p => p.id === id);

function myRide(){
  if (!S.minha) return null;

  if (f && S.user && f.clienteId && f.clienteId !== S.user.uid) return null;
  return S.corridas.find(r => r.id === S.minha) || (S.minhaLocal && S.minhaLocal.id === S.minha ? S.minhaLocal : null);
}
const pathCache = {};
const ridePath = (r, k) => { const s = r[k]; if (!s) return []; return pathCache[s] || (pathCache[s] = decPath(s)); };
function motoState(r){
  let path, t0, target;
  if (r.status === 'aceita'){ path = ridePath(r, 'rotaBusca'); if (!path.length && r.inicio) path = [ll(r.inicio), ll(r.origem)]; t0 = r.aceitaEm; target = r.origem; }
  else if (r.status === 'em_andamento'){ path = ridePath(r, 'rota'); if (!path.length) path = [ll(r.origem), ll(r.destino)]; t0 = r.iniciadaEm; target = r.destino; }
  else return null;
  const sp = r.demo ? DEMO_SPEED : SPEED;
  const gp = r.posPiloto;
  if (!r.demo && gp && Date.now() - gp.t < GPS_FRESH){
    const rem = hav(gp, target) * 1.25;
    return {pos:ll(gp), rem, prog:rem < 60 ? 1 : 0, sp, real:true};
  }
  const L = pathLen(path); const d = clamp((Date.now() - (t0 || Date.now())) / 1000 * sp, 0, L);
  return {pos:pointAt(path, d), prog:L ? d / L : 1, rem:L - d, sp};
}
const fmtRem = (rem, sp) => { const m = Math.ceil(rem / sp / 60); return rem < 40 ? 'agora' : m <= 1 ? 'menos de 1 min' : m + ' min'; };
const motoCor = r => { const p = pil(r.pilotoId); return corHex((p && p.moto && p.moto.cor) || (r.moto && r.moto.cor)); };

function cidadesAtivas(){

function cidadeDe(p){

  for (const c of cidadesAtivas()){ const d = hav(p, c); if (d <= num(c.raioKm, 10) * 1000 && d < bd){ bd = d; best = c; } }

}

let pmap;
const telaGrande = () => window.matchMedia('(min-width: 960px)').matches;
function passPad(){
  const m = $('#passMap').getBoundingClientRect();
  if (telaGrande()){ const painel = $('#sheet').getBoundingClientRect(); return {top:50, bottom:50, left:Math.max(60, painel.right - m.left + 40), right:70}; }
  const top = $('#searchCard').getBoundingClientRect().bottom - m.top + 24;
  const bottom = m.bottom - $('#sheet').getBoundingClientRect().top + 24;
  return {top, bottom:Math.min(bottom, m.height - top - 80), left:40, right:60};

function drawPass(){
  if (!pmap || !pmap.ready) return;
  const r = myRide(); const keep = [];
  const put = (k, ...a) => { keep.push(k); pmap.marker(k, ...a); };
  const line = (k, ...a) => { keep.push(k); pmap.line(k, ...a); };
  if (r && r.status !== 'cancelada'){
    if (r.status === 'aceita') line('busca', ridePath(r, 'rotaBusca').length ? ridePath(r, 'rotaBusca') : (r.inicio ? [ll(r.inicio), ll(r.origem)] : null), '#E3245A', true);
    if (r.status !== 'concluida') line('rota', ridePath(r, 'rota').length ? ridePath(r, 'rota') : [ll(r.origem), ll(r.destino)]);
    put('d', r.destino, MK.destino(), 3);
    if (r.status !== 'em_andamento') put('o', r.origem, MK.origem(), 3);
    if (pmap.markers.moto) keep.push('moto');
  } else {
    for (const p of S.pilotos) if (p.online && p.pos && Date.now() - (p.pos.t || 0) < 10 * 60000 && !ocupado(p.id)) put('l_' + p.id, p.pos, MK.livre(corHex(p.moto && p.moto.cor)), 2);
    if (S.rota) line('rota', S.rota.path);
    if (S.destino) put('d', S.destino, MK.destino(), 3);
    if (S.origem) put('o', S.origem, MK.origem(), 3);
  }
  if (S.gpsPass) put('me', S.gpsPass, MK.eu(), 1);
  pmap.areas(r && r.status !== 'cancelada' && r.status !== 'concluida' ? [] : cidadesAtivas());
  pmap.keep(keep);
}
async function onPassTap(p){
  if (myRide()){ toast('Você já tem uma corrida. Finalize ou cancele para pedir outra.'); return; }
  const which = S.field === 'destino' ? 'destino' : 'origem';
  S[which] = {...p, end:'Buscando endereço…'};
  if ((await Promise.resolve(cidadeDe(p))) == null){ afterPoint(which); return; }
  afterPoint(which);
  const end = await addressOf(p);
  if (S[which] && S[which].lat === p.lat && S[which].lng === p.lng){ S[which].end = end; updateSearchCard(); renderPass(); }

async function afterPoint(which){
  if (S[which] && !cidadeDe(S[which])){
    S[which] = null; S.rota = null; S.field = which;
    toast(`Esse local está fora da área atendida. Atendemos: ${nomesCidades()}.`);
    updateSearchCard(); renderPass(); return false;
  }
  if (which === 'origem' && !S.destino) S.field = 'destino';
  else if (which === 'destino' && !S.origem) S.field = 'origem';
  S.sheetMin = false; S.rota = null;
  updateSearchCard(); renderPass();
  if (S.origem && S.destino){
    S.calc = true; renderPass();
    const o = S.origem, d = S.destino;
    const rt = await calcRoute(o, d);
    if (S.origem !== o || S.destino !== d) return;
    S.rota = rt; S.calc = false; renderPass();
    pmap.fit([...rt.path, o, d], passPad());
  } else if (S[which]) pmap.panTo(S[which]);
}

function pilotStats(me){
  const done = S.corridas.filter(r => r.pilotoId === me.id && r.status === 'concluida');
  const t = r => r.concluidaEm || r.criadaEm; const now = new Date();
  const hoje = done.filter(r => new Date(t(r)).toDateString() === now.toDateString());
  const sem = done.filter(r => Date.now() - t(r) < 7 * 864e5);
  const mes = done.filter(r => { const d = new Date(t(r)); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const notas = done.filter(r => r.avaliacao); const media = notas.length ? (notas.reduce((s, r) => s + r.avaliacao, 0) / notas.length) : 0;
  const soma = a => BRL(a.reduce((s, r) => s + num(r.valor), 0));
  return `<div class="dash mt"><div class="stat"><b>${soma(hoje)}</b><span>hoje · ${hoje.length} corrida${hoje.length === 1 ? '' : 's'}</span></div><div class="stat"><b>${soma(sem)}</b><span>últimos 7 dias</span></div><div class="stat"><b>${soma(mes)}</b><span>este mês · ${mes.length}</span></div><div class="stat"><b>${media ? media.toFixed(1).replace('.', ',') + ' ⭐' : '—'}</b><span>avaliação (${notas.length})</span></div></div><button class="btn ghost block mt" data-act="pAba" data-v="ganhos">Ver meus ganhos e viagens</button>`;
}
function renderPilotCount(){
  const me = pil(S.meuPiloto); const n = me && me.online && !myActive() ? pendentesPara(me).length : 0;
  const c = $('#pilotCnt'); c.style.display = n ? '' : 'none'; c.textContent = n;
}
/* GPS do piloto: compartilha a posição enquanto está online */
let gpsWatch = null, lastPilotWrite = {t:0, pos:null}, lastRideWrite = 0;
function pilotGps(){
  const me = (S.role === 'piloto' || S.role === 'local') ? pil(S.meuPiloto) : null;
  const want = !!(me && me.online && navigator.geolocation);
  if (want && gpsWatch == null){
    gpsWatch = navigator.geolocation.watchPosition(p => {
      const had = !!S.myPos;
      S.myPos = {lat:p.coords.latitude, lng:p.coords.longitude}; S.gpsErr = false;
      if (!had && S.view === 'piloto') renderPiloto();
      onPilotPos();
    }, err => { S.gpsErr = true; if (S.view === 'piloto') renderPiloto(); }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  } else if (!want && gpsWatch != null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; S.myPos = null; }
}
function onPilotPos(){
  const me = pil(S.meuPiloto); if (!me || !S.myPos) return;
  const now = Date.now(); const act = myActive();
  if (act && !act.demo && now - lastRideWrite > 8000){ lastRideWrite = now; Store.update('corridas', act.id, {posPiloto:{...S.myPos, t:now}}).catch(() => {}); }
  const moved = !lastPilotWrite.pos || hav(lastPilotWrite.pos, S.myPos) > 30;
  if (!act && (now - lastPilotWrite.t > 60000 || (moved && now - lastPilotWrite.t > 20000))){ lastPilotWrite = {t:now, pos:S.myPos}; Store.update('pilotos', me.id, {pos:{...S.myPos, t:now}}).catch(() => {}); }
}
async function aceitar(id){
  const me = pil(S.meuPiloto); if (!me) return;
  if (myActive()){ toast('Finalize sua corrida atual primeiro.'); return; }
  const r = S.corridas.find(x => x.id === id);
  if (!r || r.status !== 'procurando'){ toast('Essa corrida já foi aceita por outro piloto.'); return; }
  toast('Aceitando…');
  const gps = S.myPos || await getGps(5000);
  pararAlarme();
  const ok = await aceitarComo(r, me, false, gps);
  toast(ok ? 'Corrida aceita! Vá até o passageiro.' : 'Essa corrida já foi aceita por outro piloto.');
}

      <p class="small muted mb">Faturamento das corridas concluídas: <b style="color:var(--text)">${BRL(total)}</b></p>`;

  }

}

/* ================= DASHBOARDS — empresa e piloto ================= */
const PERIODOS = [['hoje','Hoje'],['7d','7 dias'],['mes','Este mês'],['30d','30 dias'],['tudo','Tudo']];
const PER_NOME = {hoje:'hoje', '7d':'nos últimos 7 dias', mes:'neste mês', '30d':'nos últimos 30 dias', tudo:'desde o início'};
const PER_ANT = {hoje:'ontem até esta hora', '7d':'os 7 dias anteriores', mes:'o mês passado até hoje', '30d':'os 30 dias anteriores'};
const tRide = r => r.concluidaEm || r.canceladaEm || r.aceitaEm || r.criadaEm || 0;
const KM = v => (Math.round(v * 10) / 10).toLocaleString('pt-BR') + ' km';
const NOTA = v => v ? v.toFixed(1).replace('.', ',') : '—';
const plural = (n, s, p) => n + ' ' + (n === 1 ? s : (p || s + 's'));
function janela(p){
  const now = new Date(); const d0 = new Date(now); d0.setHours(0, 0, 0, 0); const D = 864e5;
  if (p === 'hoje') return [d0.getTime(), d0.getTime() + D];
  if (p === '7d') return [d0.getTime() + D - 7 * D, d0.getTime() + D];
  if (p === '30d') return [d0.getTime() + D - 30 * D, d0.getTime() + D];
  if (p === 'mes') return [new Date(now.getFullYear(), now.getMonth(), 1).getTime(), new Date(now.getFullYear(), now.getMonth() + 1, 1).getTime()];
  return [0, Infinity];
}
/* período anterior de mesmo tamanho (até o mesmo ponto), para comparar */
function janelaAnterior(p){
  const now = Date.now(); const [ini] = janela(p); const D = 864e5;
  if (p === 'hoje') return [ini - D, now - D];
  if (p === '7d') return [ini - 7 * D, ini];
  if (p === '30d') return [ini - 30 * D, ini];
  if (p === 'mes'){ const d = new Date(ini); const pi = new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime(); return [pi, Math.min(pi + (now - ini), ini)]; }
  return null;
}
const naJanela = ([a, b]) => r => { const t = tRide(r); return t >= a && t < b; };
function resumo(rs){
  const v = rs.reduce((s, r) => s + num(r.valor), 0), km = rs.reduce((s, r) => s + num(r.distKm), 0);
  const nt = rs.filter(r => r.avaliacao);
  const min = rs.reduce((s, r) => s + (r.iniciadaEm && r.concluidaEm ? (r.concluidaEm - r.iniciadaEm) / 6e4 : num(r.durMin)), 0);
  return {n:rs.length, v, km, ticket:rs.length ? v / rs.length : 0, nota:nt.length ? nt.reduce((s, r) => s + num(r.avaliacao), 0) / nt.length : 0, nNotas:nt.length, min};
}
function variacao(atual, antes){
  if (antes == null) return '';
  if (!antes && !atual) return `<span class="delta">igual</span>`;
  if (!antes) return `<span class="delta up">novo</span>`;
  const pc = Math.round((atual - antes) / antes * 100);
  return `<span class="delta ${pc > 0 ? 'up' : pc < 0 ? 'down' : ''}">${pc > 0 ? '▲' : pc < 0 ? '▼' : ''} ${Math.abs(pc)}%</span>`;
}
function chipsPeriodo(act, atual){
  return `<div class="perchips" role="tablist">${PERIODOS.map(([k, l]) => `<button class="${atual === k ? 'on' : ''}" role="tab" aria-selected="${atual === k}" data-act="${act}" data-v="${k}">${l}</button>`).join('')}</div>`;
}
/* gráfico de barras: valor por hora (hoje), por dia ou por mês (tudo) */
function grafico(done, p){
  const now = new Date(); let bs = [];
  if (p === 'hoje'){
    const h0 = new Date(now); h0.setHours(0, 0, 0, 0);
    bs = [...Array(24)].map((_, h) => ({ini:h0.getTime() + h * 36e5, fim:h0.getTime() + (h + 1) * 36e5, lab:h % 3 === 0 ? h + 'h' : '', tit:`${h}h às ${h + 1}h`, atual:h === now.getHours()}));
  } else if (p === 'tudo'){
    const prim = done.reduce((m, r) => Math.min(m, tRide(r)), Date.now()); const d = new Date(prim);
    const meses = clamp((now.getFullYear() - d.getFullYear()) * 12 + now.getMonth() - d.getMonth() + 1, 6, 12);
    bs = [...Array(meses)].map((_, i) => { const a = new Date(now.getFullYear(), now.getMonth() - meses + 1 + i, 1); const b = new Date(a.getFullYear(), a.getMonth() + 1, 1);
      return {ini:a.getTime(), fim:b.getTime(), lab:a.toLocaleDateString('pt-BR', {month:'short'}).replace('.', ''), tit:a.toLocaleDateString('pt-BR', {month:'long', year:'numeric'}), atual:i === meses - 1}; });
  } else {
    const [ini, fim] = janela(p); const ate = Math.min(fim, (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() + 864e5; })());
    const n = Math.round((ate - ini) / 864e5);
    bs = [...Array(n)].map((_, i) => { const a = new Date(ini); a.setDate(a.getDate() + i); const b = new Date(a); b.setDate(b.getDate() + 1);
      const lab = n <= 7 ? a.toLocaleDateString('pt-BR', {weekday:'short'}).replace('.', '') : (i % 5 === 0 || i === n - 1 ? String(a.getDate()) : '');
      return {ini:a.getTime(), fim:b.getTime(), lab, tit:a.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'2-digit'}), atual:a.toDateString() === now.toDateString()}; });
  }
  bs.forEach(b => { const rs = done.filter(naJanela([b.ini, b.fim])); b.v = rs.reduce((s, r) => s + num(r.valor), 0); b.n = rs.length; });
  const max = Math.max(...bs.map(b => b.v), 0);
  if (!max) return `<div class="graf vazio"><span>Sem viagens concluídas ${PER_NOME[p]}.</span></div>`;
  const imax = bs.findIndex(b => b.v === max);
  return `<div class="graf" style="--n:${bs.length}">${bs.map((b, i) => `<div class="gcol ${b.atual ? 'atual' : ''}" title="${esc(b.tit)}: ${BRL(b.v)} · ${plural(b.n, 'viagem', 'viagens')}">
      <span class="gval">${i === imax ? esc(BRL(b.v).replace(/,00$/, '')) : ''}</span>
      <span class="gtrack"><i style="height:${b.v ? Math.max(3, b.v / max * 100) : 0}%"></i></span><span class="glab">${esc(b.lab)}</span></div>`).join('')}</div>`;
}
function pagamentosHtml(done){
  const tot = done.reduce((s, r) => s + num(r.valor), 0);
  if (!tot) return `<p class="small muted">Sem valores recebidos no período.</p>`;
  const cores = {Dinheiro:'var(--cana)', Pix:'var(--fita-azul)', 'Cartão':'var(--sinal)'};
  const linhas = PAGAMENTOS.map(k => { const rs = done.filter(r => (r.pagamento || 'Dinheiro') === k); const v = rs.reduce((s, r) => s + num(r.valor), 0); return {k, v, n:rs.length}; }).filter(x => x.n);
  return `<div class="pagbar">${linhas.map(x => `<i style="width:${x.v / tot * 100}%;background:${cores[x.k]}" title="${x.k}"></i>`).join('')}</div>
    <div class="paglist">${linhas.map(x => `<div><span class="sw" style="background:${cores[x.k]}"></span><span>${x.k === 'Pix' ? '⚡' : x.k === 'Cartão' ? '💳' : '💵'} ${x.k}</span><span class="muted small">${plural(x.n, 'viagem', 'viagens')}</span><b>${BRL(x.v)}</b><span class="muted small">${Math.round(x.v / tot * 100)}%</span></div>`).join('')}</div>`;
}
function heroResumo({titulo, R, A, p, act, extra}){
  return `<section class="boletim">
    <div class="bol-top"><span class="bol-tit">${titulo}</span>${chipsPeriodo(act, p)}</div>
    <div class="bol-main"><div><span class="bol-lab">Faturado ${PER_NOME[p]}</span><b class="bol-val">${BRL(R.v)}</b>
      ${A ? `<span class="bol-cmp">${variacao(R.v, A.v)} comparado com ${PER_ANT[p]} (${BRL(A.v)})</span>` : ''}</div></div>
    <div class="bol-kpis">
      <div><b>${R.n}</b><span>${R.n === 1 ? 'viagem' : 'viagens'}${A ? ' ' + variacao(R.n, A.n) : ''}</span></div>
      <div><b>${BRL(R.ticket)}</b><span>valor médio</span></div>
      <div><b>${KM(R.km)}</b><span>rodados</span></div>
      ${extra || `<div><b>${NOTA(R.nota)}${R.nota ? ' ★' : ''}</b><span>nota (${R.nNotas})</span></div>`}
    </div></section>`;
}

/* ---------- lista de viagens agrupada por dia (piloto e detalhe) ---------- */
function viagensPorDia(rs, opts = {}){
  if (!rs.length) return `<div class="empty"><div class="big">🧾</div><b>Nenhuma viagem ${opts.per ? PER_NOME[opts.per] : ''}</b><p class="small mt">${opts.vazio || 'As viagens aparecem aqui assim que forem concluídas.'}</p></div>`;
  const grupos = new Map();
  rs.slice().sort((a, b) => tRide(b) - tRide(a)).forEach(r => { const k = new Date(tRide(r)).toDateString(); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(r); });
  const hoje = new Date().toDateString(), ontem = new Date(Date.now() - 864e5).toDateString();
  const hm = ts => ts ? new Date(ts).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '—';
  return [...grupos].map(([k, lst]) => { const fin = lst.filter(r => r.status === 'concluida'); const d = new Date(k);
    const nomeDia = k === hoje ? 'Hoje' : k === ontem ? 'Ontem' : d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
    return `<section class="dia"><header><b>${esc(nomeDia)}</b><span>${plural(fin.length, 'viagem', 'viagens')} · <b>${BRL(fin.reduce((s, r) => s + num(r.valor), 0))}</b></span></header>
      ${lst.map(r => { const [l, c] = STATUS[r.status] || [r.status, '']; const ok = r.status === 'concluida';
        const durReal = r.iniciadaEm && r.concluidaEm ? Math.max(1, Math.round((r.concluidaEm - r.iniciadaEm) / 6e4)) : null;
        return `<details class="viagem ${ok ? '' : 'off'}"><summary>
          <span class="vh">${hm(r.concluidaEm || r.canceladaEm || r.aceitaEm || r.criadaEm)}</span>
          <span class="vrota"><b>${esc(String(r.destino && r.destino.end || '').split(',')[0])}</b><small>de ${esc(String(r.origem && r.origem.end || '').split(',')[0])}${opts.comPiloto && r.pilotoNome ? ' · 🏍️ ' + esc(r.pilotoNome) : ''}</small></span>
          <span class="vval">${ok ? BRL(r.valor) : `<span class="tag ${c}">${esc(l)}</span>`}<small>${String(r.distKm || 0).replace('.', ',')} km · ${esc(r.pagamento || '')}</small></span></summary>
          <div class="vdet">
            <div class="trip"><div><span class="dot o"></span>${esc(r.origem && r.origem.end)}</div><div><span class="dot d"></span>${esc(r.destino && r.destino.end)}</div></div>
            <dl class="kv mt"><dt>Passageiro</dt><dd>${esc(r.passageiro && r.passageiro.nome || '—')}</dd>
              <dt>Valor</dt><dd>${BRL(r.valor)} · ${esc(r.pagamento || '—')}</dd>
              <dt>Distância</dt><dd>${String(r.distKm || 0).replace('.', ',')} km</dd>
              <dt>Tempo de viagem</dt><dd>${durReal ? durReal + ' min' : (r.durMin ? `~${r.durMin} min (estimado)` : '—')}</dd>
              <dt>Pedido</dt><dd>${hm(r.criadaEm)}${r.aceitaEm ? ` · aceita ${hm(r.aceitaEm)}` : ''}${r.iniciadaEm ? ` · embarque ${hm(r.iniciadaEm)}` : ''}${r.concluidaEm ? ` · fim ${hm(r.concluidaEm)}` : ''}</dd>
              ${r.status === 'cancelada' ? `<dt>Cancelada</dt><dd>${r.canceladaPor === 'passageiro' ? 'pelo passageiro' : 'sim'}</dd>` : ''}
              ${r.avaliacao ? `<dt>Avaliação</dt><dd>${'★'.repeat(clamp(r.avaliacao | 0, 1, 5))}${'☆'.repeat(5 - clamp(r.avaliacao | 0, 1, 5))}</dd>` : ''}</dl></div></details>`; }).join('')}</section>`; }).join('');
}

async function adicionarCidade(nome, uf = 'PE', raioKm = 10){

  if (S.cidades.some(c => (c.nome || '').toLowerCase() === nome.toLowerCase() && (c.uf || '') === uf)){ toast('Essa cidade já está cadastrada.'); return false; }
  toast(`Buscando ${nome}…`);

  if (nome.toLowerCase() === CONFIG.CIDADE_PADRAO.nome.toLowerCase() && uf === CONFIG.CIDADE_PADRAO.uf){ lat = CONFIG.CIDADE_PADRAO.lat; lng = CONFIG.CIDADE_PADRAO.lng; }
  else {
    try{
      const j = await nominatim(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=br&addressdetails=1&city=${encodeURIComponent(nome)}&state=${encodeURIComponent(UF_NOME[uf] || uf)}`);

}

const soDig = s => String(s || '').replace(/\D/g, '');
function cpfValido(c){ c = soDig(c); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for (const t of [9, 10]){ let s = 0; for (let i = 0; i < t; i++) s += +c[i] * (t + 1 - i); if (((s * 10) % 11) % 10 !== +c[t]) return false; } return true; }
function cnpjValido(c){ c = soDig(c); if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const calc = n => { const w = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; let s = 0; for (let i = 0; i < n; i++) s += +c[i] * w[i]; const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === +c[12] && calc(13) === +c[13]; }
function fmtDoc(tipo, v){ const d = soDig(v);
  if (tipo === 'cpf') return d.slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  return d.slice(0, 14).replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2'); }
const docTexto = e => { const t = e.docTipo || (e.cnpj ? 'cnpj' : ''); const v = e.documento || e.cnpj || ''; return v ? `${t === 'cpf' ? 'CPF' : 'CNPJ'} ${v}` : ''; };

function tocarAlarme(dur = 45000){

    try{ if (audioCtx){ const t = audioCtx.currentTime + 0.02; [0, 0.18, 0.36, 0.7, 0.88, 1.06].forEach((s, i) => bip(t + s, i % 2 ? 988 : 1319, 0.15)); } }catch(e){}
    try{ navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 600]); }catch(e){}
  };

          const base = e ? (({id:_, ...r}) => r)(e) : {criadaEm:Date.now()};

          await Store.set('empresas', eid, {...base, ...d, ...acesso, logo:logoFinal});
          if (acesso.uid) await Store.set('empresaUsers', acesso.uid, {empresaId:eid, email, criadoEm:Date.now()});

function readPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const side = Math.min(img.width, img.height); const c = document.createElement('canvas'); c.width = c.height = Math.min(320, side);
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.78)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; img.src = url;
  });
}

function parseFb(txt){
  txt = String(txt || '').trim(); if (!txt) return null;
  const m = txt.match(/\{[\s\S]*\}/); if (!m) throw new Error('fb');
  const json = m[0].replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
  const o = JSON.parse(json); if (!o.apiKey || !o.projectId) throw new Error('fb'); return o;
}

const MASTERS = (CONFIG.MASTERS || []).map(e => e.toLowerCase());
const userEmail = () => ((S.user && S.user.email) || '').toLowerCase();
const pilotoDoUsuario = () => { const e = userEmail(); return e ? S.pilotos.find(p => (p.email || '').toLowerCase() === e) : null; };
function computeRole(){
  if (!Store.auth) return 'local';
  if (!S.authReady || !S.user) return null;
  if (MASTERS.includes(userEmail()) && S.user.emailVerified) return 'master';
  if (!S.empUserLoaded) return 'pending';
  if (S.empUser && S.empUser.empresaId) return 'empresa';
  if (!S.loaded.pilotos) return 'pending';
  const p = pilotoDoUsuario();
  if (p) return S.user.emailVerified ? 'piloto' : 'piloto-verificar';
  return 'cliente';
}
function allowedViews(){

function applyRole(){

  if (S._unsubCorr){ S._unsubCorr(); S._unsubCorr = null; }
  if (S._unsubClis){ S._unsubClis(); S._unsubClis = null; }
  S.corridas = []; S.loaded.corridas = false; S.clientes = [];
  ['#admBody', '#admTabs', '#pilotTop', '#pilotBottom'].forEach(s => { const el = $(s); if (el){ el.innerHTML = ''; el._html = ''; } }); S.pAba = 'painel';
  if (role === 'piloto-verificar' && !S._verifSent){ S._verifSent = true; Store.authMod.sendEmailVerification(S.user).catch(() => {}); }

    linkPiloto(p).then(() => { if (S.role === 'piloto') S._unsubCorr = Store.subscribe('corridas', onCorridas, ['empresaId', p.empresaId]); });
  } else if (role !== 'piloto' && Store.auth) S.meuPiloto = '';

  if (role === 'master' || role === 'local') S._unsubCorr = Store.subscribe('corridas', onCorridas);
  if (role === 'empresa'){ S.minhaEmpresa = S.empUser.empresaId; S.admTab = 'painel'; S._unsubCorr = Store.subscribe('corridas', onCorridas, ['empresaId', S.minhaEmpresa]); }

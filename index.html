<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B45">
<title>MotoJá — Mototáxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F3F5EF; --sup:#FFFFFF; --sup2:#F7F9F5; --tinta:#15231C; --cinza:#5B6961; --linha:#DCE3DA; --linha-forte:#C5D0C6;
  --cana:#0E6B45; --cana-esc:#0A5135; --cana-bg:#E3F0E8;
  --sinal:#FFB400; --sinal-bg:#FFF4D6; --sinal-sombra:rgba(255,180,0,.28);
  --fita-rosa:#E3245A; --fita-azul:#2364D2;
  --ok-ink:#127A47; --danger-ink:#B4302A; --warn-ink:#8A5A00; --info-ink:#1D5BB8;
  --text:var(--tinta); --muted:var(--cinza); --line:var(--linha); --brand:var(--cana); --panel:var(--sup); --panel2:var(--sup2); --bg:var(--papel);
  --r-sheet:26px; --r-card:16px; --r-ctl:12px;
  --sombra:0 1px 2px rgba(21,35,28,.06),0 6px 18px rgba(21,35,28,.08);
  --f-disp:'Bricolage Grotesque',system-ui,sans-serif; --f-txt:'Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#E7ECE4;color:var(--tinta);font-family:var(--f-txt);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sinal);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* moldura do app */
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--papel);position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--linha),0 20px 60px rgba(21,35,28,.12)}
.fitas{display:block;height:5px;background:linear-gradient(90deg,var(--cana) 0 25%,var(--sinal) 25% 50%,var(--fita-rosa) 50% 75%,var(--fita-azul) 75% 100%)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--sup);border-bottom:1px solid var(--linha);z-index:10}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:-.035em;color:var(--tinta)}
.brand b{color:var(--cana);font-weight:800}
.marca{width:30px;height:30px;flex:none;display:block}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sup2);color:var(--cinza);border:1px solid var(--linha);white-space:nowrap}
.badge.ok{color:var(--ok-ink);border-color:#BFE0CC;background:#EEF7F1}
.badge.warn{color:var(--warn-ink);border-color:#F1DBA6;background:#FFF8E6}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--linha);background:var(--sup);display:grid;place-items:center;cursor:pointer;font-size:15px;color:var(--cinza)}
.iconbtn:hover{border-color:var(--linha-forte)}
#contaBtn{border:2px solid var(--cana)}
#contaBtn img{width:100%;height:100%;object-fit:cover}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.view.active{display:block}
#view-passageiro{overflow:hidden}

/* navegação inferior */
nav.bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sup);border-top:1px solid var(--linha);padding:6px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;z-index:10}
nav.bottom button{background:none;border:0;border-radius:14px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--cinza);font-size:12.5px;font-weight:700;cursor:pointer;position:relative}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--cana);background:var(--cana-bg)}
nav.bottom .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--fita-rosa);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 6px;border:2px solid var(--sup)}

/* mapa */
.map{position:absolute;inset:0;touch-action:none;background:#E8EDE6;overflow:hidden;z-index:0}
.leaflet-container{background:#E8EDE6;font-family:var(--f-txt);cursor:crosshair}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.8)!important}
.map .leaflet-top.leaflet-right{top:38%}
.leaflet-bar{border:0!important;box-shadow:var(--sombra)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{background:var(--sup);color:var(--tinta);border-color:var(--linha)!important;width:38px!important;height:38px!important;line-height:38px!important}
.lmk{background:none;border:0}
.mk-o{width:28px;height:28px;transform:translateY(50%);display:grid;place-items:center}
.mk-o span{width:18px;height:18px;border-radius:50%;background:var(--cana);border:3px solid #fff;box-shadow:0 0 0 6px rgba(14,107,69,.22),0 2px 6px rgba(0,0,0,.3)}
.mk-d svg{display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.mk-m{width:42px;height:42px;border-radius:50%;background:var(--tinta);border:4px solid var(--c);display:grid;place-items:center;font-size:19px;transform:translateY(50%);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 28%,transparent),0 4px 10px rgba(0,0,0,.3)}
.mk-m.sm{width:30px;height:30px;border-width:3px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mk-me{width:16px;height:16px;border-radius:50%;background:var(--fita-azul);border:3px solid #fff;transform:translateY(50%);box-shadow:0 0 0 8px rgba(35,100,210,.2)}

/* busca (origem/destino) */
.searchCard{position:absolute;top:12px;left:12px;right:12px;background:var(--sup);border-radius:20px;padding:6px;z-index:6;box-shadow:0 2px 4px rgba(21,35,28,.06),0 12px 32px rgba(21,35,28,.16)}
.field{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;cursor:pointer;border:1.5px solid transparent}
.field.active{background:var(--sup2);border-color:var(--cana)}
.field .lbl{font-size:12px;font-weight:700;color:var(--cinza)}
.field .val{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .val.ph{color:#8A968F;font-weight:400}
.field input{background:none;border:0;outline:0;width:100%;font-size:15px;font-weight:700;padding:0}
.field input::placeholder{color:#8A968F;font-weight:400}
.field .grow{flex:1;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.o{background:var(--cana);box-shadow:0 0 0 4px var(--cana-bg)}
.dot.d{background:var(--sinal);border-radius:3px;box-shadow:0 0 0 4px var(--sinal-bg)}
.xbtn{background:var(--sup2);border:1px solid var(--linha);border-radius:99px;width:28px;height:28px;font-size:12px;cursor:pointer;color:var(--cinza);flex:none}
.sep{height:1px;background:var(--linha);margin:0 12px 0 36px}
.gpsbtn{background:var(--cana-bg);color:var(--cana);border:0;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;flex:none}
.sugs{max-height:240px;overflow:auto;border-top:1px solid var(--linha);margin-top:4px;padding-top:4px}
.sug{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:15px}
.sug:hover,.sug.hl{background:var(--sup2)}
.sug small{color:var(--cinza);display:block;font-size:12.5px}

/* painel inferior (sheet) */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--sup);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:6px 18px 18px;z-index:5;box-shadow:0 -8px 30px rgba(21,35,28,.14);transition:max-height .25s}
.sheet.min{max-height:96px;overflow:hidden}
.grabzone{padding:6px 0 4px;cursor:pointer}
.grab{width:44px;height:5px;background:var(--linha-forte);border-radius:5px;margin:0 auto 10px}

/* tipografia */
h2{font-family:var(--f-disp);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
h3{font-family:var(--f-disp);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.muted{color:var(--cinza)}
.small{font-size:13.5px}
.eta{font-family:var(--f-disp);font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.1}

/* utilidades de layout */
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:12px}.mt2{margin-top:22px}.mb{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column;gap:10px}
.hr{height:1px;background:var(--linha);margin:16px 0}
.pad{padding:14px}

/* botões */
.btn{background:var(--cana);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,background .15s;text-decoration:none;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn:hover{background:var(--cana-esc)}
.btn:active{transform:scale(.985)}
.btn.block{width:100%}
.btn.ghost{background:var(--sup);color:var(--tinta);border:1.5px solid var(--linha-forte);box-shadow:none}
.btn.ghost:hover{background:var(--sup2)}
.btn.danger{background:#FCEDEC;color:var(--danger-ink);border:1.5px solid #F2C9C6;box-shadow:none}
.btn.ok{background:var(--cana);color:#fff}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.gbtn{background:#fff;color:#1F1F1F;border:1.5px solid var(--linha-forte)}
.gbtn:hover{background:#F6F7F6}
.linkbtn{background:none;border:0;color:var(--cana);font-weight:700;font-size:14px;cursor:pointer;padding:6px}
.chip{border:1.5px solid var(--linha);background:var(--sup);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--tinta)}
.chip:hover{border-color:var(--linha-forte)}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}

/* opções de empresa */
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-card);border:1.5px solid var(--linha);background:var(--sup);cursor:pointer}
.opt.on{border-color:var(--cana);background:var(--cana-bg)}
.opt.off{opacity:.6}
.opt .price{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:-.02em;margin-left:auto;text-align:right}
.elogo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:#fff;flex:none;font-size:15px;text-shadow:0 1px 1px rgba(0,0,0,.25)}

/* formulários */
.input{width:100%;background:var(--sup);border:1.5px solid var(--linha-forte);border-radius:var(--r-ctl);padding:12px 13px;font-size:15px;outline:0;color:var(--tinta)}
.input:focus{border-color:var(--cana);box-shadow:0 0 0 3px var(--cana-bg)}
.input::placeholder{color:#93A098}
textarea.input{font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#5B6961 50%),linear-gradient(135deg,#5B6961 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:var(--tinta)}
label.f > span{font-weight:400;color:var(--cinza);font-size:12.5px}
.photoUp{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--linha-forte);border-radius:var(--r-card);cursor:pointer;background:var(--sup2)}
.photoUp img{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--sup);border:3px solid var(--cana)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors label{display:flex;align-items:center;gap:6px;padding:7px 11px;border:1.5px solid var(--linha);border-radius:99px;cursor:pointer;font-size:13px;font-weight:700;color:var(--tinta);background:var(--sup)}
.colors input{display:none}
.colors label:has(input:checked){border-color:var(--cana);background:var(--cana-bg)}
.colors em{font-style:normal}
.switch{width:54px;height:32px;border-radius:99px;background:#C9D2CB;position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--cana)}
.switch.on::after{left:25px}

/* cartões e listas */
.card{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r-card);padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:11px 12px}
.stat b{font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--cinza)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dash .stat{padding:14px}
.dash .stat b{font-size:24px}
.bar{height:8px;border-radius:8px;background:var(--sup2);border:1px solid var(--linha);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cana);border-radius:8px}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--sup2);border:2px solid var(--linha)}
.avatar.lg{width:74px;height:74px;border:3px solid var(--cana)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sup2);border:1px solid var(--linha);color:var(--cinza)}
.tag.on{color:var(--ok-ink);border-color:#BFE0CC;background:#EEF7F1}
.tag.y{color:var(--warn-ink);border-color:#F1DBA6;background:var(--sinal-bg)}
.tag.r{color:var(--danger-ink);border-color:#F2C9C6;background:#FCEDEC}
.tag.b{color:var(--info-ink);border-color:#C7D8F3;background:#EEF4FD}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block;flex:none}
/* placa padrão Mercosul */
.plate{display:inline-flex;flex-direction:column;align-items:center;background:#fff;color:#111;font-weight:800;letter-spacing:.1em;padding:0 10px 3px;border-radius:5px;border:1.5px solid #1b1b1b;font-size:16px;font-family:var(--f-disp);line-height:1.2;overflow:hidden}
.plate::before{content:'BRASIL';display:block;width:calc(100% + 20px);background:#1C4CA8;color:#fff;font-size:7px;letter-spacing:.25em;text-align:center;padding:1px 0;margin:0 -10px 2px;font-family:var(--f-txt)}
.tabs{display:flex;gap:6px;padding:12px 14px;position:sticky;top:0;background:var(--papel);z-index:3;border-bottom:1px solid var(--linha);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:1 0 auto;text-align:center;white-space:nowrap}
.empty{text-align:center;padding:30px 18px;color:var(--cinza);border:1.5px dashed var(--linha-forte);border-radius:var(--r-card);background:var(--sup)}
.empty b{color:var(--tinta);font-family:var(--f-disp);font-size:17px;font-weight:700}
.empty .big{font-size:28px;width:64px;height:64px;border-radius:50%;background:var(--cana-bg);display:grid;place-items:center;margin:0 auto 12px}
.note{font-size:13.5px;color:var(--tinta);background:var(--sinal-bg);border:1px solid #F1DBA6;border-radius:var(--r-ctl);padding:11px 13px}
.spinner{width:54px;height:54px;border-radius:50%;border:4px solid var(--cana-bg);border-top-color:var(--cana);animation:spin 1s linear infinite;margin:6px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.driver{display:flex;gap:14px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--cinza)}
.kv dd{font-weight:700}
.trip{display:flex;flex-direction:column;gap:9px;font-size:14px}
.trip div{display:flex;gap:10px;align-items:center}
.stars{display:flex;justify-content:center;gap:4px}
.stars button{background:none;border:0;font-size:32px;cursor:pointer;filter:grayscale(1);opacity:.35}
.stars button.on{filter:none;opacity:1}
.pmapwrap{position:relative;height:260px;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--linha);margin:0 14px}
.pmapwrap .map{border-radius:var(--r-card)}

/* oferta de corrida tocando no piloto */
.oferta{border:2px solid var(--sinal)!important;background:linear-gradient(var(--sinal-bg),var(--sup) 70%)!important;box-shadow:0 0 0 5px var(--sinal-sombra)!important}

/* login / cadastro */
.authview{position:absolute;inset:0;z-index:8;background:var(--papel);overflow:auto}
.authhero{position:relative;height:170px;background:var(--cana)}
.authhero > svg:first-child{position:absolute;inset:0;width:100%;height:100%;display:block}
.authhero > svg.marca{position:absolute;left:50%;bottom:-36px;transform:translateX(-50%);width:80px;height:80px;background:var(--sup);border-radius:24px;padding:10px;box-shadow:0 0 0 5px var(--papel),var(--sombra)}
.authcard{max-width:420px;margin:0 auto;padding:50px 20px 34px}
.authlogo{display:none}
.or{display:flex;align-items:center;gap:10px;color:var(--cinza);font-size:13px;margin:18px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--linha)}
.authErr{background:#FCEDEC;color:var(--danger-ink);border:1px solid #F2C9C6;border-radius:12px;padding:10px 12px;font-size:14px}

/* modal, aviso, carregando */
.modal{position:fixed;inset:0;background:rgba(21,35,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.modal.hidden{display:none}
.modal-card{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--sup);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:20px 18px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media(min-width:600px){.modal{align-items:center}.modal-card{border-radius:var(--r-sheet)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.splash{position:absolute;inset:0;display:grid;place-items:center;background:var(--papel);z-index:40}
#destAC{min-height:24px}
#destAC gmp-place-autocomplete{width:100%}
a.btn{text-decoration:none}
</style>
</head>
<body>
<div id="app">
  <span class="fitas" aria-hidden="true"></span>
  <header class="top">
    <div class="brand"><svg class="marca" viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="mhd"><rect width="32" height="32" rx="9"/></clipPath></defs><g clip-path="url(#mhd)"><rect width="32" height="32" fill="#0E6B45"/><g transform="rotate(-24 16 16)"><rect x="7" y="-6" width="4.6" height="44" fill="#FFB400"/><rect x="13.7" y="-6" width="4.6" height="44" fill="#E3245A"/><rect x="20.4" y="-6" width="4.6" height="44" fill="#2364D2"/></g></g></svg><span>Moto<b>Já</b></span></div>
    <div class="row" style="gap:8px"><span id="syncBadge" class="badge">carregando…</span><button class="iconbtn" id="contaBtn" data-act="conta" aria-label="Minha conta" style="display:none;padding:0;overflow:hidden"></button><button class="iconbtn" data-act="setup" aria-label="Configurações">⚙️</button></div>
  </header>
  <main>
    <section id="view-passageiro" class="view active">
      <div class="map" id="passMap"></div>
      <div class="searchCard" id="searchCard">
        <div class="field" id="fOrig" data-act="field" data-f="origem">
          <span class="dot o"></span>
          <div class="grow"><div class="lbl">Sua localização</div><div class="val ph" id="origTxt">Toque no mapa ou use o GPS</div></div>
          <button class="gpsbtn" id="gpsBtn" data-act="gps">📡 GPS</button>

async function osrmRoute(a, b){

async function calcRoute(a, b){
  a = ll(a); b = ll(b);

          const path = r.path.map(p => ({lat:typeof p.lat === 'function' ? p.lat() : p.lat, lng:typeof p.lng === 'function' ? p.lng() : p.lng}));

  panTo(p){ this.map.panTo(ll(p)); }
  center(){ const c = this.map.getCenter(); return c ? {lat:c.lat(), lng:c.lng()} : null; }
  onIdle(fn){ this.map.addListener('idle', fn); }
}
/* Mapa OpenStreetMap (Leaflet) com a mesma interface */
class LMap{
  constructor(el, opts = {}){ this.el = el; this.opts = opts; this.markers = {}; this.lines = {}; this.ready = false; }
  async init(center){
    await loadLeaflet();
    this.map = L.map(this.el, {zoomControl:false, attributionControl:true}).setView([center.lat, center.lng], 15);
    L.control.zoom({position:'topright'}).addTo(this.map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(this.map);
    if (this.opts.onTap) this.map.on('click', e => this.opts.onTap({lat:e.latlng.lat, lng:e.latlng.lng}));
    setTimeout(() => this.map.invalidateSize(), 200);
    this.ready = true; return this;
  }
  marker(key, pos, html, z = 1){
    let m = this.markers[key];
    if (!pos){ if (m){ m.remove(); delete this.markers[key]; } return; }
    const icon = () => L.divIcon({className:'lmk', html:`<div style="transform:translate(-50%,-100%);width:max-content">${html}</div>`, iconSize:[0, 0]});
    if (!m){ m = L.marker([pos.lat, pos.lng], {icon:icon(), zIndexOffset:z * 100, interactive:false}).addTo(this.map); m._html = html; this.markers[key] = m; }
    if (m._html !== html){ m.setIcon(icon()); m._html = html; }
    m.setLatLng([pos.lat, pos.lng]);
  }
  line(key, path, color = '#0E6B45', dashed = false){
    let l = this.lines[key];
    if (!path || path.length < 2){ if (l){ l.forEach(x => x.remove()); delete this.lines[key]; } return; }
    const sig = encPath(path) + color + dashed; if (l && l._sig === sig) return;
    if (l) l.forEach(x => x.remove());
    const pts = path.map(p => [p.lat, p.lng]);
    l = [L.polyline(pts, {color:'#ffffff', opacity:.95, weight:10, interactive:false}).addTo(this.map),
         L.polyline(pts, {color, weight:5, opacity:1, dashArray:dashed ? '2 12' : null, lineCap:'round', interactive:false}).addTo(this.map)];
    l._sig = sig; this.lines[key] = l;
  }
  keep(keys){
    for (const k of Object.keys(this.markers)) if (!keys.includes(k)) this.marker(k, null);
    for (const k of Object.keys(this.lines)) if (!keys.includes(k)) this.line(k, null);
  }
  fit(points, pad){
    points = points.filter(Boolean).map(ll); if (!points.length || !this.map) return;
    if (points.length === 1 || points.every(p => hav(p, points[0]) < 30)){ this.map.setView([points[0].lat, points[0].lng], 16); return; }
    const b = L.latLngBounds(points.map(p => [p.lat, p.lng]));
    const P = typeof pad === 'number' || !pad ? {top:pad || 40, bottom:pad || 40, left:pad || 40, right:pad || 40} : pad;
    this.map.fitBounds(b, {paddingTopLeft:[P.left, P.top], paddingBottomRight:[P.right, P.bottom], maxZoom:17});
  }
  areas(list){
    const sig = JSON.stringify(list.map(c => [c.lat, c.lng, c.raioKm])); if (this._asig === sig) return; this._asig = sig;
    (this._areas || []).forEach(a => a.remove());
    this._areas = list.map(c => L.circle([+c.lat, +c.lng], {radius:num(c.raioKm, 10) * 1000, color:'#0E6B45', weight:1.5, dashArray:'6 8', fillColor:'#0E6B45', fillOpacity:.05, interactive:false}).addTo(this.map));
  }
  panTo(p){ this.map.panTo([p.lat, p.lng]); }
  center(){ const c = this.map.getCenter(); return {lat:c.lat, lng:c.lng}; }
  onIdle(fn){ this.map.on('moveend', fn); }
}
const makeMap = (el, opts) => MODE === 'osm' ? new LMap(el, opts) : new GMap(el, opts);

/* ================= armazenamento (Firebase Firestore ou local) ================= */
const Store = {
  mode:'local', fs:null, db:null, ls:{},
  async init(){
    if (!CFG.firebase) return;
    try{
      const V = '10.12.2';
      const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
      this.fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
      const fbApp = app.initializeApp(CFG.firebase);
      this.db = this.fs.getFirestore(fbApp);
      try{ this.authMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`); this.auth = this.authMod.getAuth(fbApp); this.auth.languageCode = 'pt'; }
      catch(e){ console.error('auth', e); this.auth = null; }
      this.mode = 'cloud';
    }catch(e){ console.error(e); toast('Não consegui conectar ao Firebase — usando dados locais.'); }
  },
  key: c => 'mt_' + c,
  readLocal(c){ return LS.get(this.key(c), {}); },
  notify(c){ (this.ls[c] || []).forEach(f => f()); },
  subscribe(c, cb, filter){
    if (this.mode === 'cloud'){
      const { collection, onSnapshot, query, where } = this.fs;
      const ref = filter ? query(collection(this.db, c), where(filter[0], '==', filter[1])) : collection(this.db, c);
      return onSnapshot(ref, s => { setSync('ok'); cb(s.docs.map(d => ({...d.data(), id:d.id}))); },
        e => { console.error(c, e); setSync('warn', e.code === 'permission-denied' ? 'sem permissão' : 'erro ao sincronizar'); });
    }
    const fire = () => cb(Object.values(this.readLocal(c)).filter(x => !filter || x[filter[0]] === filter[1]));
    (this.ls[c] = this.ls[c] || []).push(fire); fire();
    return () => { this.ls[c] = (this.ls[c] || []).filter(f => f !== fire); };
  },
  async run(fn){
    try{ return await fn(); }
    catch(e){ console.error(e); toast(e && e.code === 'permission-denied' ? 'Sem permissão para salvar (regras do Firestore).' : 'Não foi possível salvar. Tente de novo.'); throw e; }
  },
  async set(c, id, data){
    const {id:_, ...body} = data;
    if (this.mode === 'cloud'){ const { doc, setDoc } = this.fs; return this.run(() => setDoc(doc(this.db, c, id), clean(body))); }
    const all = this.readLocal(c); all[id] = {...clean(body), id}; LS.set(this.key(c), all); this.notify(c);
  },
  async update(c, id, p){
    if (this.mode === 'cloud'){ const { doc, updateDoc } = this.fs; return this.run(() => updateDoc(doc(this.db, c, id), clean(p))); }
    const all = this.readLocal(c); if (!all[id]) return; all[id] = {...all[id], ...clean(p)}; LS.set(this.key(c), all); this.notify(c);
  },
  async del(c, id){
    if (this.mode === 'cloud'){ const { doc, deleteDoc } = this.fs; return this.run(() => deleteDoc(doc(this.db, c, id))); }
    const all = this.readLocal(c); delete all[id]; LS.set(this.key(c), all); this.notify(c);
  },
  /* aceita a corrida só se ainda estiver "procurando" (evita dois pilotos na mesma corrida) */
  async claim(id, p, check){
    const ok = d => d && d.status === 'procurando' && (!check || check(d));
    if (this.mode === 'cloud'){
      const { doc, runTransaction } = this.fs; const ref = doc(this.db, 'corridas', id);
      try{
        await runTransaction(this.db, async tx => { const s = await tx.get(ref); if (!s.exists() || !ok(s.data())) throw new Error('taken'); tx.update(ref, clean(p)); });
        return true;
      }catch(e){ if (e.message === 'taken') return false; toast('Não foi possível aceitar. Tente de novo.'); throw e; }
    }
    const all = this.readLocal('corridas'); if (!all[id] || !ok(all[id])) return false;
    all[id] = {...all[id], ...clean(p)}; LS.set(this.key('corridas'), all); this.notify('corridas'); return true;
  },
  /* transação genérica: fn(dadosAtuais) devolve o patch ou null para não alterar */
  async tx(c, id, fn){
    if (this.mode === 'cloud'){
      const { doc, runTransaction } = this.fs; const ref = doc(this.db, c, id); let out = null;
      try{ await runTransaction(this.db, async tx => { const s = await tx.get(ref); const patch = fn(s.exists() ? s.data() : null); out = patch; if (patch) tx.update(ref, clean(patch)); }); return out; }
      catch(e){ console.warn('tx', e); return null; }
    }
    const all = this.readLocal(c); const patch = fn(all[id] ? {...all[id]} : null); if (!patch) return null;
    all[id] = {...all[id], ...clean(patch)}; LS.set(this.key(c), all); this.notify(c); return patch;
  }
};
window.addEventListener('storage', e => { if (Store.mode === 'local' && e.key && e.key.startsWith('mt_')) Store.notify(e.key.slice(3)); });
function setSync(kind, txt){

  if (Store.mode === 'local'){ b.className = 'badge warn'; b.textContent = '💾 salvo só neste aparelho'; return; }

const emp = id => S.empresas.find(e => e.id === id);
const pil = id => S.pilotos.find(p => p.id === id);
const ATIVOS = ['procurando','aceita','em_andamento'];
const ocupado = pid => { const p = S.pilotos.find(x => x.id === pid); return !!(p && p.emCorrida) || S.corridas.some(r => r.pilotoId === pid && (r.status === 'aceita' || r.status === 'em_andamento')); };
function myRide(){
  if (!S.minha) return null;
  const f = S.corridas.find(r => r.id === S.minha);
  if (f && S.user && f.clienteId && f.clienteId !== S.user.uid) return null;
  return S.corridas.find(r => r.id === S.minha) || (S.minhaLocal && S.minhaLocal.id === S.minha ? S.minhaLocal : null);
}
const pathCache = {};
const ridePath = (r, k) => { const s = r[k]; if (!s) return []; return pathCache[s] || (pathCache[s] = decPath(s)); };
function motoState(r){
  let path, t0, target;
  if (r.status === 'aceita'){ path = ridePath(r, 'rotaBusca'); if (!path.length && r.inicio) path = [ll(r.inicio), ll(r.origem)]; t0 = r.aceitaEm; target = r.origem; }
  else if (r.status === 'em_andamento'){ path = ridePath(r, 'rota'); if (!path.length) path = [ll(r.origem), ll(r.destino)]; t0 = r.iniciadaEm; target = r.destino; }
  else return null;
  const sp = r.demo ? DEMO_SPEED : SPEED;
  const gp = r.posPiloto;
  if (!r.demo && gp && Date.now() - gp.t < GPS_FRESH){
    const rem = hav(gp, target) * 1.25;
    return {pos:ll(gp), rem, prog:rem < 60 ? 1 : 0, sp, real:true};
  }
  const L = pathLen(path); const d = clamp((Date.now() - (t0 || Date.now())) / 1000 * sp, 0, L);
  return {pos:pointAt(path, d), prog:L ? d / L : 1, rem:L - d, sp};
}
const fmtRem = (rem, sp) => { const m = Math.ceil(rem / sp / 60); return rem < 40 ? 'agora' : m <= 1 ? 'menos de 1 min' : m + ' min'; };
const motoCor = r => { const p = pil(r.pilotoId); return corHex((p && p.moto && p.moto.cor) || (r.moto && r.moto.cor)); };

function cidadesAtivas(){

function cidadeDe(p){
  if (!p) return null; let best = null, bd = Infinity;
  for (const c of cidadesAtivas()){ const d = hav(p, c); if (d <= num(c.raioKm, 10) * 1000 && d < bd){ bd = d; best = c; } }
  return best;
}

let pmap;
function passPad(){
  const m = $('#passMap').getBoundingClientRect();
  const top = $('#searchCard').getBoundingClientRect().bottom - m.top + 24;
  const bottom = m.bottom - $('#sheet').getBoundingClientRect().top + 24;
  return {top, bottom:Math.min(bottom, m.height - top - 80), left:40, right:60};

function drawPass(){
  if (!pmap || !pmap.ready) return;
  const r = myRide(); const keep = [];
  const put = (k, ...a) => { keep.push(k); pmap.marker(k, ...a); };
  const line = (k, ...a) => { keep.push(k); pmap.line(k, ...a); };
  if (r && r.status !== 'cancelada'){
    if (r.status === 'aceita') line('busca', ridePath(r, 'rotaBusca').length ? ridePath(r, 'rotaBusca') : (r.inicio ? [ll(r.inicio), ll(r.origem)] : null), '#E3245A', true);
    if (r.status !== 'concluida') line('rota', ridePath(r, 'rota').length ? ridePath(r, 'rota') : [ll(r.origem), ll(r.destino)]);
    put('d', r.destino, MK.destino(), 3);
    if (r.status !== 'em_andamento') put('o', r.origem, MK.origem(), 3);
    if (pmap.markers.moto) keep.push('moto');
  } else {
    for (const p of S.pilotos) if (p.online && p.pos && Date.now() - (p.pos.t || 0) < 10 * 60000 && !ocupado(p.id)) put('l_' + p.id, p.pos, MK.livre(corHex(p.moto && p.moto.cor)), 2);
    if (S.rota) line('rota', S.rota.path);
    if (S.destino) put('d', S.destino, MK.destino(), 3);
    if (S.origem) put('o', S.origem, MK.origem(), 3);
  }
  if (S.gpsPass) put('me', S.gpsPass, MK.eu(), 1);
  pmap.areas(r && r.status !== 'cancelada' && r.status !== 'concluida' ? [] : cidadesAtivas());
  pmap.keep(keep);
}
async function onPassTap(p){
  if (myRide()){ toast('Você já tem uma corrida. Finalize ou cancele para pedir outra.'); return; }
  const which = S.field === 'destino' ? 'destino' : 'origem';
  S[which] = {...p, end:'Buscando endereço…'};
  if ((await Promise.resolve(cidadeDe(p))) == null){ afterPoint(which); return; }
  afterPoint(which);
  const end = await addressOf(p);
  if (S[which] && S[which].lat === p.lat && S[which].lng === p.lng){ S[which].end = end; updateSearchCard(); renderPass(); }
}
async function afterPoint(which){
  if (S[which] && !cidadeDe(S[which])){
    S[which] = null; S.rota = null; S.field = which;
    toast(`Esse local está fora da área atendida. Atendemos: ${nomesCidades()}.`);
    updateSearchCard(); renderPass(); return false;
  }
  if (which === 'origem' && !S.destino) S.field = 'destino';
  else if (which === 'destino' && !S.origem) S.field = 'origem';
  S.sheetMin = false; S.rota = null;
  updateSearchCard(); renderPass();
  if (S.origem && S.destino){
    S.calc = true; renderPass();
    const o = S.origem, d = S.destino;
    const rt = await calcRoute(o, d);
    if (S.origem !== o || S.destino !== d) return;

    pmap.fit([...rt.path, o, d], passPad());

async function pedir(){
  if (Store.auth && (!S.user || (S.role === 'cliente' && !S.cliente))){ toast('Entre na sua conta para pedir.'); renderAll(); return; }

  const e = emp(S.empresaSel); if (!e){ toast('Escolha uma empresa'); return; }
  const km = Math.round(S.rota.distM / 100) / 10;
  const id = uid();
  const r = {id, status:'procurando', criadaEm:Date.now(), passageiro:{nome:S.pNome.slice(0, 60), tel:S.pTel.slice(0, 30)},
    origem:{lat:S.origem.lat, lng:S.origem.lng, end:S.origem.end}, destino:{lat:S.destino.lat, lng:S.destino.lng, end:S.destino.end},
    rota:encPath(S.rota.path), distKm:km, durMin:Math.round(S.rota.durS / 60), valor:precoEmp(e, km), empresaId:e.id, empresaNome:e.nome, pagamento:S.pagamento, pilotoId:null, demo:false, clienteId:S.user ? S.user.uid : null, cidade:(cidadeDe(S.origem) || {}).nome || ''};
  S.minhaLocal = r; S.minha = id; LS.set('mtu_minha', id);
  renderPass();
  const livres = S.pilotos.filter(p => p.empresaId === e.id && p.online && !ocupado(p.id)).sort((a, b) => (a.filaDesde || 0) - (b.filaDesde || 0));
  r.distribuicao = e.distribuicao === 'vez' ? 'vez' : 'escolha'; r.tempoOferta = num(e.tempoOferta, 30); r.recusados = [];
  if (r.distribuicao === 'vez' && livres.length){ r.modo = 'vez'; r.fila = livres.map(p => p.id).slice(0, 30); r.ofertaIdx = 0; r.ofertaPara = livres[0].id; r.ofertaAte = Date.now() + r.tempoOferta * 1000; }
  else { r.modo = 'todos'; r.fila = []; r.ofertaIdx = -1; r.ofertaPara = null; r.ofertaAte = null; }
  try{ await Store.set('corridas', id, r); toast('Pedido enviado! 🏍️'); avisarPilotos(r, r.modo === 'vez' ? [livres[0]] : livres); }catch(err){ S.minha = null; S.minhaLocal = null; LS.set('mtu_minha', null); renderPass(); }
}
async function aceitarComo(r, p, demo, gps){

  if (!inicio){ const ang = (hash(p.id + r.id) % 628) / 100; inicio = offsetPoint(ll(r.origem), 900 + hash(r.id) % 1200, ang); }
  const rb = await calcRoute(inicio, r.origem);
  return Store.claim(r.id, {status:'aceita', pilotoId:p.id, pilotoNome:p.nome, moto:p.moto || {}, aceitaEm:Date.now(), inicio, rotaBusca:encPath(rb.path), demo:!!demo, ofertaPara:null, ofertaAte:null},

}
async function simular(){

  const cands = S.pilotos.filter(p => p.empresaId === r.empresaId);
  const p = cands.find(p => p.online && !ocupado(p.id)) || cands.find(p => !ocupado(p.id)) || cands[0];

    b += `<h3 class="mt2 mb">Minhas últimas corridas</h3>${hist.length ? `<div class="list">${hist.map(r => { const [l, c] = STATUS[r.status] || [r.status, '']; return `<div class="card" style="padding:12px"><div class="row between"><span class="tag ${c}">${esc(l)}</span><span class="small muted">${new Date(r.concluidaEm || r.criadaEm).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span></div><div class="small mt"><b>${esc(r.passageiro && r.passageiro.nome)}</b>${r.avaliacao ? ' · ' + '⭐'.repeat(clamp(r.avaliacao|0, 1, 5)) : ''}</div>${tripBox(r)}</div>`; }).join('')}</div>` : `<div class="empty small">Suas corridas finalizadas aparecem aqui.</div>`}`;
  }
  patch($('#pilotBottom'), b);
  pilotGps();
  if (me && (S.role === 'piloto' || S.role === 'local')){
    const busy = !!act;
    if (!!me.emCorrida !== busy && S._emCorridaSync !== me.id + busy){ S._emCorridaSync = me.id + busy; Store.update('pilotos', me.id, busy ? {emCorrida:true} : {emCorrida:false, filaDesde:Date.now()}).catch(() => {}); }
  }
}
function pilotStats(me){
  const done = S.corridas.filter(r => r.pilotoId === me.id && r.status === 'concluida');
  const t = r => r.concluidaEm || r.criadaEm; const now = new Date();
  const hoje = done.filter(r => new Date(t(r)).toDateString() === now.toDateString());
  const sem = done.filter(r => Date.now() - t(r) < 7 * 864e5);
  const mes = done.filter(r => { const d = new Date(t(r)); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const notas = done.filter(r => r.avaliacao); const media = notas.length ? (notas.reduce((s, r) => s + r.avaliacao, 0) / notas.length) : 0;
  const soma = a => BRL(a.reduce((s, r) => s + num(r.valor), 0));
  return `<div class="dash mt"><div class="stat"><b>${soma(hoje)}</b><span>hoje · ${hoje.length} corrida${hoje.length === 1 ? '' : 's'}</span></div><div class="stat"><b>${soma(sem)}</b><span>últimos 7 dias</span></div><div class="stat"><b>${soma(mes)}</b><span>este mês · ${mes.length}</span></div><div class="stat"><b>${media ? media.toFixed(1).replace('.', ',') + ' ⭐' : '—'}</b><span>avaliação (${notas.length})</span></div></div>`;
}
function renderPilotCount(){
  const me = pil(S.meuPiloto); const n = me && me.online && !myActive() ? pendentesPara(me).length : 0;
  const c = $('#pilotCnt'); c.style.display = n ? '' : 'none'; c.textContent = n;
}
/* GPS do piloto: compartilha a posição enquanto está online */
let gpsWatch = null, lastPilotWrite = {t:0, pos:null}, lastRideWrite = 0;
function pilotGps(){
  const me = (S.role === 'piloto' || S.role === 'local') ? pil(S.meuPiloto) : null;
  const want = !!(me && me.online && navigator.geolocation);
  if (want && gpsWatch == null){
    gpsWatch = navigator.geolocation.watchPosition(p => {
      const had = !!S.myPos;
      S.myPos = {lat:p.coords.latitude, lng:p.coords.longitude}; S.gpsErr = false;
      if (!had && S.view === 'piloto') renderPiloto();
      onPilotPos();
    }, err => { S.gpsErr = true; if (S.view === 'piloto') renderPiloto(); }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  } else if (!want && gpsWatch != null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; S.myPos = null; }
}
function onPilotPos(){
  const me = pil(S.meuPiloto); if (!me || !S.myPos) return;
  const now = Date.now(); const act = myActive();
  if (act && !act.demo && now - lastRideWrite > 8000){ lastRideWrite = now; Store.update('corridas', act.id, {posPiloto:{...S.myPos, t:now}}).catch(() => {}); }
  const moved = !lastPilotWrite.pos || hav(lastPilotWrite.pos, S.myPos) > 30;
  if (!act && (now - lastPilotWrite.t > 60000 || (moved && now - lastPilotWrite.t > 20000))){ lastPilotWrite = {t:now, pos:S.myPos}; Store.update('pilotos', me.id, {pos:{...S.myPos, t:now}}).catch(() => {}); }
}
async function aceitar(id){
  const me = pil(S.meuPiloto); if (!me) return;
  if (myActive()){ toast('Finalize sua corrida atual primeiro.'); return; }
  const r = S.corridas.find(x => x.id === id);
  if (!r || r.status !== 'procurando'){ toast('Essa corrida já foi aceita por outro piloto.'); return; }
  toast('Aceitando…');
  const gps = S.myPos || await getGps(5000);
  pararAlarme();
  const ok = await aceitarComo(r, me, false, gps);
  toast(ok ? 'Corrida aceita! Vá até o passageiro.' : 'Essa corrida já foi aceita por outro piloto.');
}

function masterDash(){
  const now = new Date(); const t = r => r.concluidaEm || r.criadaEm;
  const mesmoDia = (ts, d) => new Date(ts).toDateString() === d.toDateString();
  const doMes = ts => { const d = new Date(ts); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); };
  const done = S.corridas.filter(r => r.status === 'concluida');
  const hoje = done.filter(r => mesmoDia(t(r), now)), mes = done.filter(r => doMes(t(r)));
  const pedHoje = S.corridas.filter(r => mesmoDia(r.criadaEm, now));
  const cancHoje = pedHoje.filter(r => r.status === 'cancelada').length;
  const ativos = S.corridas.filter(r => ATIVOS.includes(r.status)).sort((a, b) => b.criadaEm - a.criadaEm);
  const soma = a => a.reduce((s, r) => s + num(r.valor), 0);
  const online = S.pilotos.filter(p => p.online).length;
  const dias = [...Array(7)].map((_, i) => { const d = new Date(now); d.setDate(d.getDate() - 6 + i); const v = soma(done.filter(r => mesmoDia(t(r), d))); return {d, v}; });
  const maxDia = Math.max(1, ...dias.map(x => x.v));
  const porEmp = S.empresas.map(e => { const rs = mes.filter(r => r.empresaId === e.id); return {e, n:rs.length, v:soma(rs)}; }).sort((a, b) => b.v - a.v);
  const maxEmp = Math.max(1, ...porEmp.map(x => x.v));
  const porPil = S.pilotos.map(p => { const rs = mes.filter(r => r.pilotoId === p.id); const nt = rs.filter(r => r.avaliacao); return {p, n:rs.length, v:soma(rs), m:nt.length ? nt.reduce((s, r) => s + r.avaliacao, 0) / nt.length : 0}; }).filter(x => x.n).sort((a, b) => b.v - a.v).slice(0, 5);
  return `<div class="dash">
      <div class="stat"><b style="color:var(--brand)">${BRL(soma(hoje))}</b><span>faturamento hoje</span></div>
      <div class="stat"><b>${BRL(soma(mes))}</b><span>faturamento no mês</span></div>
      <div class="stat"><b>${pedHoje.length}</b><span>pedidos hoje · ${hoje.length} concluídos${cancHoje ? ' · ' + cancHoje + ' cancel.' : ''}</span></div>
      <div class="stat"><b style="color:var(--info-ink)">${ativos.length}</b><span>corridas agora</span></div>
      <div class="stat"><b style="color:var(--ok-ink)">${online}<small class="muted" style="font-size:13px"> / ${S.pilotos.length}</small></b><span>pilotos online</span></div>
      <div class="stat"><b>${(S.clientes || []).length}</b><span>clientes cadastrados</span></div>
      <div class="stat"><b>${S.empresas.length}</b><span>empresas</span></div>
      <div class="stat"><b>${mes.length ? BRL(soma(mes) / mes.length) : '—'}</b><span>ticket médio (mês)</span></div>
    </div>
    <div class="card mt"><h3>Faturamento — últimos 7 dias</h3>
      <div class="row mt" style="align-items:flex-end;gap:6px;height:120px">${dias.map(x => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span class="small muted" style="font-size:10px">${x.v ? Math.round(x.v) : ''}</span><div style="width:100%;height:${Math.max(3, x.v / maxDia * 80)}px;background:${mesmoDia(x.d, now) ? 'var(--cana)' : '#C5D0C6'};border-radius:6px 6px 2px 2px"></div><span class="small muted" style="font-size:10px">${x.d.toLocaleDateString('pt-BR', {weekday:'short'}).replace('.', '')}</span></div>`).join('')}</div></div>
    <div class="card mt"><h3>Corridas agora (${ativos.length})</h3>${ativos.length ? `<div class="list mt">${ativos.slice(0, 8).map(r => { const [l, c] = STATUS[r.status] || [r.status, '']; return `<div style="border-top:1px solid var(--line);padding-top:10px"><div class="row between"><span class="tag ${c}">${esc(l)}</span><span class="small muted">${ago(r.criadaEm)}</span></div><div class="small mt"><b>${esc(r.passageiro && r.passageiro.nome)}</b>${r.pilotoNome ? ' → 🏍️ ' + esc(r.pilotoNome) : ''} · ${esc(r.empresaNome)} · <b>${BRL(r.valor)}</b></div><div class="small muted">${esc(r.origem.end)} → ${esc(r.destino.end)}</div></div>`; }).join('')}</div>` : `<p class="small muted mt">Nenhuma corrida em andamento.</p>`}</div>
    <div class="card mt"><h3>Empresas no mês</h3>${porEmp.length ? `<div class="list mt">${porEmp.map(x => `<div><div class="row between small"><span class="row" style="gap:8px"><span class="sw" style="background:${safeColor(x.e.cor)}"></span><b>${esc(x.e.nome)}</b></span><span>${x.n} corrida${x.n === 1 ? '' : 's'} · <b>${BRL(x.v)}</b></span></div><div class="bar mt" style="margin-top:6px"><i style="width:${x.v / maxEmp * 100}%;background:${safeColor(x.e.cor)}"></i></div></div>`).join('')}</div>` : `<p class="small muted mt">Cadastre empresas na aba Empresas.</p>`}</div>
    <div class="card mt"><h3>Melhores pilotos do mês</h3>${porPil.length ? `<div class="list mt">${porPil.map((x, i) => `<div class="row" style="gap:10px"><b class="muted" style="width:18px">${i + 1}º</b><img class="avatar" style="width:36px;height:36px" src="${safeImg(x.p.foto, x.p.nome)}" alt=""><div style="flex:1;min-width:0"><b class="small">${esc(x.p.nome)}</b><div class="small muted">${x.n} corrida${x.n === 1 ? '' : 's'}${x.m ? ' · ' + x.m.toFixed(1).replace('.', ',') + ' ⭐' : ''}</div></div><b class="small">${BRL(x.v)}</b></div>`).join('')}</div>` : `<p class="small muted mt">Ainda não há corridas concluídas neste mês.</p>`}</div>`;
}

function cidadesTab(){
  const lista = S.cidades.slice().sort((a, b) => (b.ativa !== false) - (a.ativa !== false) || (a.nome || '').localeCompare(b.nome || ''));
  const ativas = lista.filter(c => c.ativa !== false).length;
  const tem = n => S.cidades.some(c => (c.nome || '').toLowerCase() === n.toLowerCase());
  const sug = (CONFIG.SUGESTOES_REGIAO || []).filter(n => !tem(n));
  const corridasCidade = n => S.corridas.filter(r => r.cidade === n).length;
  let h = `<div class="row between mb"><h3>Cidades atendidas</h3><button class="btn sm" data-act="novaCidade">＋ Adicionar cidade</button></div>

async function adicionarCidade(nome, uf = 'PE', raioKm = 10){

const APP_URL = location.origin + location.pathname;
function enviarNtfy(topic, title, message, priority = 5){
  if (!topic) return;
  fetch('https://ntfy.sh/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({topic, title, message, priority, tags:['motor_scooter'], click:APP_URL + '#piloto'})}).catch(e => console.warn('ntfy', e));
}
function avisarPilotos(r, lista){
  for (const p of (lista || []).filter(Boolean)) if (p.ntfy) enviarNtfy(p.ntfy, '🏍️ Nova corrida — MotoJá', `${r.origem.end} → ${r.destino.end}\n${BRL(r.valor)} · ${String(r.distKm).replace('.', ',')} km · ${r.pagamento}${r.modo === 'vez' ? `\nVocê tem ${num(r.tempoOferta, 30)} s para aceitar.` : ''}`);
}
/* passa a corrida "por vez" para o próximo piloto da fila (qualquer aparelho pode fazer; a transação evita duplicar) */
const _avancadas = new Set();
async function avancarOferta(r0, motivo){
  const idx0 = r0.ofertaIdx == null ? -1 : r0.ofertaIdx; const key = r0.id + ':' + idx0;
  if (_avancadas.has(key)) return; _avancadas.add(key);
  let alvo = null;
  const patch = await Store.tx('corridas', r0.id, r => {
    if (!r || r.status !== 'procurando' || r.modo !== 'vez' || (r.ofertaIdx == null ? -1 : r.ofertaIdx) !== idx0) return null;
    const rec = [...(r.recusados || [])]; if (motivo === 'recusa' && r.ofertaPara && !rec.includes(r.ofertaPara)) rec.push(r.ofertaPara);
    const fila = r.fila || [];
    for (let i = idx0 + 1; i < fila.length; i++){ const p = pil(fila[i]); if (p && p.online && !ocupado(p.id) && !rec.includes(p.id)){ alvo = p; return {ofertaIdx:i, ofertaPara:p.id, ofertaAte:Date.now() + num(r.tempoOferta, 30) * 1000, recusados:rec}; } }
    return {modo:'todos', ofertaIdx:fila.length, ofertaPara:null, ofertaAte:null, recusados:rec};
  });
  if (!patch) return;
  const r = {...r0, ...patch};
  if (alvo) avisarPilotos(r, [alvo]);
  else avisarPilotos(r, S.pilotos.filter(p => p.empresaId === r.empresaId && p.online && !ocupado(p.id) && !(r.recusados || []).includes(p.id)));
}
setInterval(() => {
  if (!S.loaded.corridas) return;
  for (const r of S.corridas) if (r.status === 'procurando' && r.modo === 'vez' && r.ofertaAte && Date.now() > r.ofertaAte + 1500) avancarOferta(r, 'tempo');
}, 2000);

let audioCtx = null, alarmeTimer = null, alarmeFim = 0, wakeLock = null, swReg = null;
async function prepararAlertas(pedirPermissao = true){
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') await audioCtx.resume(); }catch(e){}
  try{ if ('serviceWorker' in navigator && !swReg) swReg = await navigator.serviceWorker.register('sw.js'); }catch(e){}
  try{ if (pedirPermissao && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); }catch(e){}
  manterTela();
}
document.addEventListener('pointerdown', () => { try{ if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){} }, {passive:true});
function bip(t0, f, d){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.start(t0); o.stop(t0 + d + 0.02);
}
function tocarAlarme(dur = 45000){
  alarmeFim = Date.now() + dur;
  if (alarmeTimer) return;
  const ciclo = () => {
    if (Date.now() > alarmeFim){ pararAlarme(); return; }
    try{ if (audioCtx){ const t = audioCtx.currentTime + 0.02; [0, 0.18, 0.36, 0.7, 0.88, 1.06].forEach((s, i) => bip(t + s, i % 2 ? 988 : 1319, 0.15)); } }catch(e){}
    try{ navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 600]); }catch(e){}
  };
  ciclo(); alarmeTimer = setInterval(ciclo, 2000);
  const b = document.getElementById('alarmeBar'); if (b) b.style.display = '';
}
function pararAlarme(){
  if (alarmeTimer){ clearInterval(alarmeTimer); alarmeTimer = null; }
  try{ navigator.vibrate && navigator.vibrate(0); }catch(e){}
  const b = document.getElementById('alarmeBar'); if (b) b.style.display = 'none';
}
async function notificarSistema(title, body, tag){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opt = {body, tag, renotify:true, requireInteraction:true, vibrate:[500, 200, 500, 200, 800], data:{url:APP_URL + '#piloto'}};
  try{ const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration()); if (reg){ await reg.showNotification(title, opt); return; } }catch(e){}
  try{ new Notification(title, opt); }catch(e){}
}
async function manterTela(){
  const me = pil(S.meuPiloto);
  try{ if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible' && (!me || me.online !== false)){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }catch(e){}
}

document.addEventListener('visibilitychange', () => { const me = pil(S.meuPiloto); if (document.visibilityState === 'visible' && me && me.online && (S.role === 'piloto' || S.role === 'local')) manterTela(); });
/* toca quando aparece uma corrida nova para este piloto */
const _vistas = new Set();
function checarAlarme(){
  const me = (S.role === 'piloto' || S.role === 'local') ? pil(S.meuPiloto) : null;
  if (!me || !me.online || myActive() || !S.loaded.corridas){ pararAlarme(); return; }
  const pend = pendentesPara(me);
  if (!pend.length){ pararAlarme(); return; }
  const novas = pend.filter(r => !_vistas.has(r.id + ':' + (r.ofertaIdx == null ? -1 : r.ofertaIdx)));
  novas.forEach(r => _vistas.add(r.id + ':' + (r.ofertaIdx == null ? -1 : r.ofertaIdx)));
  if (novas.length){
    const r = novas[0];
    tocarAlarme(r.modo === 'vez' ? num(r.tempoOferta, 30) * 1000 : 45000);
    notificarSistema('🏍️ Nova corrida — MotoJá', `${r.origem.end} → ${r.destino.end} · ${BRL(r.valor)}`, 'corrida-' + r.id);
  }
}

function readPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const side = Math.min(img.width, img.height); const c = document.createElement('canvas'); c.width = c.height = Math.min(320, side);
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.78)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; img.src = url;
  });
}

function parseFb(txt){
  txt = String(txt || '').trim(); if (!txt) return null;
  const m = txt.match(/\{[\s\S]*\}/); if (!m) throw new Error('fb');
  const json = m[0].replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
  const o = JSON.parse(json); if (!o.apiKey || !o.projectId) throw new Error('fb'); return o;
}

/* ================= CONTA DO CLIENTE ================= */
const MASTERS = (CONFIG.MASTERS || []).map(e => e.toLowerCase());
const userEmail = () => ((S.user && S.user.email) || '').toLowerCase();
const pilotoDoUsuario = () => { const e = userEmail(); return e ? S.pilotos.find(p => (p.email || '').toLowerCase() === e) : null; };
function computeRole(){
  if (!Store.auth) return 'local';
  if (!S.authReady || !S.user) return null;
  if (MASTERS.includes(userEmail()) && S.user.emailVerified) return 'master';
  if (!S.loaded.pilotos) return 'pending';
  const p = pilotoDoUsuario();
  if (p) return S.user.emailVerified ? 'piloto' : 'piloto-verificar';
  return 'cliente';
}
function allowedViews(){
  return ({local:['passageiro','piloto','master'], master:['master','passageiro'], piloto:['piloto'], cliente:['passageiro']})[S.role] || ['passageiro'];
}
/* troca de perfil: ajusta assinaturas do banco e a tela inicial */
function applyRole(){
  const role = computeRole();
  if (role === S.role) return false;
  S.role = role;
  if (S._unsubCorr){ S._unsubCorr(); S._unsubCorr = null; }
  if (S._unsubClis){ S._unsubClis(); S._unsubClis = null; }
  S.corridas = []; S.loaded.corridas = false; S.clientes = [];
  if (role === 'piloto-verificar' && !S._verifSent){ S._verifSent = true; Store.authMod.sendEmailVerification(S.user).catch(() => {}); }
  if (role === 'piloto'){
    const p = pilotoDoUsuario(); S.meuPiloto = p.id;
    linkPiloto(p).then(() => { if (S.role === 'piloto') S._unsubCorr = Store.subscribe('corridas', onCorridas, ['empresaId', p.empresaId]); });
  } else if (role !== 'piloto' && Store.auth) S.meuPiloto = '';
  if (role === 'cliente') S._unsubCorr = Store.subscribe('corridas', onCorridas, ['clienteId', S.user.uid]);
  if (role === 'master' || role === 'local') S._unsubCorr = Store.subscribe('corridas', onCorridas);
  if (role === 'master') S._unsubClis = Store.subscribe('clientes', list => { S.clientes = list; renderAll(); });
  if (role === 'master' && S.user && !S.cliente) S.cliLoaded = true;
  const av = allowedViews(); const want = location.hash.slice(1);
  go(role === 'local' && av.includes(want) ? want : av[0]);
  return true;
}
async function linkPiloto(p){
  const u = S.user; if (!u) return;
  try{
    await Store.set('pilotoUsers', u.uid, {pilotoId:p.id, email:userEmail(), atualizadoEm:Date.now()});
    if (p.uid !== u.uid) await Store.update('pilotos', p.id, {uid:u.uid});
  }catch(e){ console.error('link piloto', e); }
}
let lastRideKey = '';
function onCorridas(list){
  S.corridas = list; S.loaded.corridas = true;
  if (S.user && S.role === 'cliente' && !myRide()){ const ativa = S.corridas.filter(x => x.clienteId === S.user.uid && ATIVOS.includes(x.status)).sort((a, b) => b.criadaEm - a.criadaEm)[0]; if (ativa){ S.minha = ativa.id; LS.set('mtu_minha', ativa.id); } }
  renderAll();
  const r = myRide(); const key = r ? r.id + r.status : '';
  if (key !== lastRideKey){ lastRideKey = key;
    if (r && (r.status === 'aceita' || r.status === 'em_andamento') && pmap && pmap.ready){ S.sheetMin = false; renderPass();
      setTimeout(() => pmap.fit(r.status === 'aceita' ? [...ridePath(r, 'rotaBusca'), r.inicio, r.origem, r.destino] : [...ridePath(r, 'rota'), r.origem, r.destino], passPad()), 50); }
  }
  if (S.view === 'piloto') fitPilot();
}
function authGate(){
  if (!Store.auth) return 'ok';
  if (!S.authReady) return 'loading';
  if (!S.user) return 'login';
  if (!S.role || S.role === 'pending') return 'loading';
  if (S.role === 'piloto-verificar') return 'verificar';
  if (S.role === 'cliente'){
    if (!S.cliLoaded) return 'loading';
    if (!S.cliente || !S.cliente.nome || !S.cliente.telefone) return 'perfil';
  }
  return 'ok';
}
function initAuth(){
  if (!Store.auth){ S.authReady = true; return; }
  const A = Store.authMod;
  A.onAuthStateChanged(Store.auth, u => {
    S.user = u; S.authReady = true; S.authErr = '';
    if (S._unsubCli){ S._unsubCli(); S._unsubCli = null; }
    S.cliente = null; S.cliLoaded = false;
    if (u && !MASTERS.includes((u.email || '').toLowerCase())){
      const { doc, onSnapshot } = Store.fs;
      S._unsubCli = onSnapshot(doc(Store.db, 'clientes', u.uid), s => { S.cliente = s.exists() ? s.data() : null; S.cliLoaded = true; renderAll(); },
        e => { console.error(e); S.cliLoaded = true; renderAll(); });
    }
    renderAll();
  });
  A.getRedirectResult(Store.auth).catch(err => { S.authErr = authMsg(err); renderAll(); });
}
function authMsg(e){
  const c = (e && e.code) || '';
  return ({
    'auth/email-already-in-use':'Este e-mail já tem conta. Toque em “Entrar”.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'Não existe conta com esse e-mail. Toque em “Criar conta”.',
    'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/missing-password':'Digite a senha.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente de novo.',
    'auth/network-request-failed':'Sem conexão com a internet.',
    'auth/unauthorized-domain':'Este endereço não está autorizado para login.',
    'auth/operation-not-allowed':'Esse tipo de login não está ativado.',
  })[c] || 'Não foi possível entrar. Tente de novo.';
}
function authHtml(gate){
  if (gate === 'loading') return `<div style="display:grid;place-items:center;height:100%"><div class="spinner"></div></div>`;
  const err = S.authErr ? `<div class="authErr mt">${esc(S.authErr)}</div>` : '';
  if (gate === 'verificar'){
    const p = pilotoDoUsuario();
    return `${HERO()}<div class="authcard"><h2 style="text-align:center">Confirme seu e-mail</h2>
      <p class="muted mt" style="text-align:center;font-size:14px">Olá${p ? ', ' + esc(p.nome.split(' ')[0]) : ''}! Você está cadastrado como <b style="color:var(--text)">piloto</b>. Por segurança, confirme o e-mail <b style="color:var(--text)">${esc(userEmail())}</b> tocando no link que enviamos para ele.</p>
      ${err}
      <button class="btn block mt2" data-act="jaConfirmei">Já confirmei meu e-mail</button>
      <button class="btn ghost block mt" data-act="reenviarVerif">Reenviar e-mail de confirmação</button>
      <p class="small muted mt" style="text-align:center">Dica: entrando com a conta Google desse e-mail, não precisa confirmar.</p>
      <button type="button" class="linkbtn block mt" data-act="sair" style="width:100%">Sair</button></div>`;
  }
  if (gate === 'perfil'){
    const u = S.user || {}; const foto = S.cliFotoTmp || (S.cliente && S.cliente.foto) || '';
    return `${HERO()}<div class="authcard"><h2 style="text-align:center">Complete seu cadastro</h2>
      <p class="muted small mt" style="text-align:center">O piloto vai ver seu nome e telefone quando aceitar a corrida.</p>
      <form id="fPerfil" class="col mt2">
        <label class="photoUp"><img id="cliFotoPrev" src="${safeImg(foto, u.displayName || '?')}" alt=""><div><b>Sua foto (opcional)</b><div class="small muted">Ajuda o piloto a te encontrar</div></div><input type="file" accept="image/*" id="cliFoto" hidden></label>
        <label class="f">Nome completo *<input class="input" name="nome" required maxlength="60" value="${esc((S.cliente && S.cliente.nome) || u.displayName || '')}"></label>
        <label class="f">Telefone (WhatsApp) *<input class="input" name="telefone" required maxlength="20" inputmode="tel" placeholder="(81) 99999-0000" value="${esc((S.cliente && S.cliente.telefone) || '')}"></label>
        ${err}<button class="btn block mt">Salvar e continuar</button>
        <button type="button" class="linkbtn" data-act="sair">Sair e usar outra conta</button>
      </form></div>`;
  }
  const criar = S.authTab !== 'entrar';
  return `${HERO()}<div class="authcard">
    <h2 style="text-align:center">${criar ? 'Crie sua conta no MotoJá' : 'Entre na sua conta'}</h2>
    <p class="muted mt" style="text-align:center">Peça mototáxi em ${esc(nomesCidades())} e acompanhe o piloto no mapa. É grátis.</p>
    <button class="btn gbtn block mt2" data-act="loginGoogle"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Continuar com Google</button>
    <div class="or">ou com e-mail</div>
    <div class="row" style="gap:6px"><button class="chip ${criar ? 'on' : ''}" style="flex:1" data-act="authTab" data-v="criar">Criar conta</button><button class="chip ${criar ? '' : 'on'}" style="flex:1" data-act="authTab" data-v="entrar">Entrar</button></div>
    <form id="fAuth" class="col mt">
      ${criar ? `<label class="f">Nome completo<input class="input" name="nome" required maxlength="60" autocomplete="name"></label>
      <label class="f">Telefone (WhatsApp)<input class="input" name="telefone" required maxlength="20" inputmode="tel" autocomplete="tel" placeholder="(81) 99999-0000"></label>` : ''}
      <label class="f">E-mail<input class="input" name="email" type="email" required autocomplete="email"></label>
      <label class="f">Senha${criar ? ' (mín. 6 caracteres)' : ''}<input class="input" name="senha" type="password" required minlength="6" autocomplete="${criar ? 'new-password' : 'current-password'}"></label>
      ${err}
      <button class="btn block mt">${criar ? 'Criar minha conta' : 'Entrar'}</button>
      ${criar ? '' : `<button type="button" class="linkbtn" data-act="resetSenha">Esqueci minha senha</button>`}
    </form></div>`;
}
async function loginGoogle(){
  const A = Store.authMod; const prov = new A.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
  S.authErr = '';
  try{ await A.signInWithPopup(Store.auth, prov); }
  catch(e){
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){ try{ await A.signInWithRedirect(Store.auth, prov); return; }catch(e2){ e = e2; } }
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
    console.error(e); S.authErr = authMsg(e); renderAll();
  }
}
async function authSubmit(f){
  const A = Store.authMod; const d = new FormData(f); const btn = f.querySelector('button.btn');
  const email = String(d.get('email') || '').trim(), senha = String(d.get('senha') || '');
  btn.disabled = true; S.authErr = '';
  try{
    if (S.authTab !== 'entrar'){
      const nome = String(d.get('nome') || '').trim(), telefone = String(d.get('telefone') || '').trim();
      if (!nome || !telefone){ S.authErr = 'Preencha nome e telefone.'; renderAll(); return; }
      const cred = await A.createUserWithEmailAndPassword(Store.auth, email, senha);
      try{ await A.updateProfile(cred.user, {displayName:nome}); }catch(e){}
      const ehPiloto = S.pilotos.some(x => (x.email || '').toLowerCase() === email.toLowerCase()) || MASTERS.includes(email.toLowerCase());
      if (!ehPiloto) await Store.set('clientes', cred.user.uid, {nome, telefone, email, foto:'', criadoEm:Date.now()});
      toast('Conta criada! Bem-vindo(a) ao MotoJá 🏍️');
    } else {
      await A.signInWithEmailAndPassword(Store.auth, email, senha);
    }
  }catch(e){ console.error(e); S.authErr = authMsg(e); _renderAuthKeep(f); }
  finally{ btn.disabled = false; }
}
function _renderAuthKeep(f){
  const vals = Object.fromEntries(new FormData(f)); renderAll();
  const nf = document.getElementById('fAuth'); if (nf) for (const [k, v] of Object.entries(vals)) if (nf.elements[k] && k !== 'senha') nf.elements[k].value = v;
}
async function resetSenha(){
  const f = document.getElementById('fAuth'); const email = f && f.elements.email.value.trim();
  if (!email){ S.authErr = 'Digite seu e-mail acima e toque de novo em “Esqueci minha senha”.'; renderAll(); return; }
  try{ await Store.authMod.sendPasswordResetEmail(Store.auth, email); toast('Enviamos um e-mail para você criar uma nova senha.'); }
  catch(e){ S.authErr = authMsg(e); _renderAuthKeep(f); }
}
async function perfilSubmit(f){
  const d = new FormData(f); const nome = String(d.get('nome') || '').trim(), telefone = String(d.get('telefone') || '').trim();
  if (!nome || !telefone){ toast('Preencha nome e telefone'); return; }
  const u = S.user; if (!u) return;
  const body = {...(S.cliente || {}), nome, telefone, email:u.email || '', foto:S.cliFotoTmp || (S.cliente && S.cliente.foto) || '', criadoEm:(S.cliente && S.cliente.criadoEm) || Date.now(), atualizadoEm:Date.now()};
  try{ await Store.set('clientes', u.uid, body); S.cliFotoTmp = null; closeModal(); toast('Cadastro salvo ✅'); }catch(e){}
}
function renderContaBtn(){
  const b = $('#contaBtn'); const show = !!(S.user && authGate() === 'ok');
  b.style.display = show ? '' : 'none';
  if (!show) return;
  const me = S.role === 'piloto' ? pil(S.meuPiloto) : null;
  const src = me ? safeImg(me.foto, me.nome) : S.role === 'master' ? avatarFor('M', '#0E6B45') : safeImg(S.cliente && S.cliente.foto, (S.cliente && S.cliente.nome) || userEmail());
  if (b._src !== src){ b.innerHTML = `<img src="${src}" alt="">`; b._src = src; }
}
function contaModal(){
  if (!S.user) return;
  if (S.role !== 'cliente'){
    const me = S.role === 'piloto' ? pil(S.meuPiloto) : null; const e = me && emp(me.empresaId);
    openModal(`<div class="row between"><h3>${S.role === 'master' ? '👑 Conta master' : 'Minha conta de piloto'}</h3><button class="xbtn" data-act="closeModal" aria-label="Fechar">✕</button></div>
      <div class="driver mt"><img class="avatar lg" src="${me ? safeImg(me.foto, me.nome) : avatarFor('M', '#0E6B45')}" alt=""><div><b style="font-size:17px">${esc(me ? me.nome : (S.user.displayName || 'Administrador'))}</b><div class="small muted">${esc(userEmail())}</div>${e ? `<div class="small muted">${esc(e.nome)}</div>` : ''}</div></div>
      ${me ? `<p class="note mt">Seus dados (foto, moto, placa) são atualizados pelo administrador. Peça a ele se precisar mudar algo.</p>` : `<p class="note mt">Você tem acesso total: empresas, pilotos, clientes e corridas. Também pode testar o app pela aba <b>Passageiro</b>.</p>`}
      <button class="btn danger block mt2" data-act="sair">Sair da conta</button>`);
    return;
  }
  const c = S.cliente || {}; S.cliFotoTmp = null;
  const minhas = S.corridas.filter(r => r.clienteId === S.user.uid).sort((a, b) => b.criadaEm - a.criadaEm).slice(0, 30);
  const total = minhas.filter(r => r.status === 'concluida').reduce((s, r) => s + num(r.valor), 0);
  openModal(`<div class="row between"><h3>Minha conta</h3><button class="xbtn" data-act="closeModal" aria-label="Fechar">✕</button></div>
    <form id="fPerfil" class="col mt">
      <label class="photoUp"><img id="cliFotoPrev" src="${safeImg(c.foto, c.nome)}" alt=""><div><b>${esc(c.nome || '')}</b><div class="small muted">${esc(S.user.email || '')}</div><div class="small" style="color:var(--brand)">Trocar foto</div></div><input type="file" accept="image/*" id="cliFoto" hidden></label>
      <div class="grid2"><label class="f">Nome<input class="input" name="nome" required maxlength="60" value="${esc(c.nome || '')}"></label><label class="f">Telefone<input class="input" name="telefone" required maxlength="20" inputmode="tel" value="${esc(c.telefone || '')}"></label></div>
      <button class="btn block">Salvar alterações</button>
    </form>
    <div class="hr"></div>
    <div class="row between"><h3>Minhas corridas</h3><span class="small muted">${minhas.filter(r => r.status === 'concluida').length} concluídas · ${BRL(total)}</span></div>
    <div class="list mt">${minhas.length ? minhas.map(r => { const [l, cl] = STATUS[r.status] || [r.status, '']; return `<div class="card" style="padding:12px"><div class="row between"><span class="tag ${cl}">${esc(l)}</span><span class="small muted">${new Date(r.criadaEm).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span></div>${r.pilotoNome ? `<div class="small mt">🏍️ ${esc(r.pilotoNome)}${r.avaliacao ? ' · ' + '⭐'.repeat(clamp(r.avaliacao|0, 1, 5)) : ''}</div>` : ''}${tripBox(r)}</div>`; }).join('') : `<div class="empty small">Você ainda não fez nenhuma corrida.</div>`}</div>
    <button class="btn danger block mt2" data-act="sair">Sair da conta</button>`);
}

function go(v){
  if (v === 'empresas') v = 'master';
  const av = allowedViews(); if (!av.includes(v)) v = av[0];
  S.view = v;
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('active', x.id === 'view-' + v));
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (location.hash !== '#' + v){ try{ history.replaceState(null, '', '#' + v); }catch(e){} }
  setTimeout(() => { [pmap, pilotMap].forEach(m => { try{ m && m.map && m.map.invalidateSize && m.map.invalidateSize(); }catch(e){} }); }, 60);
  renderAll();
}
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view) go(v); });
function renderAll(){
  if (applyRole()) return;
  const gate = authGate();
  $('#authView').style.display = gate === 'ok' ? 'none' : '';
  $('#nav').style.display = gate === 'ok' && allowedViews().length > 1 ? '' : 'none';
  document.querySelectorAll('nav.bottom button').forEach(b => b.style.display = allowedViews().includes(b.dataset.v) ? '' : 'none');
  renderContaBtn();
  if (gate !== 'ok'){ patch($('#authView'), authHtml(gate)); pilotGps(); return; }
  if (S.view === 'passageiro') renderPass();
  if (S.view === 'piloto') renderPiloto(); else pilotGps();
  if (S.view === 'master') renderAdmin();
  renderPilotCount();
  checarAlarme();
}

/* ---------- animação da moto ---------- */
let lastT = 0;
function tick(t){
  requestAnimationFrame(tick);
  if (t - lastT < 250) return; lastT = t;
  document.querySelectorAll('[data-ate]').forEach(el => { const s = String(Math.max(0, Math.ceil((+el.dataset.ate - Date.now()) / 1000))); if (el.textContent !== s) el.textContent = s; });
  document.querySelectorAll('[data-barate]').forEach(el => { el.style.width = clamp((+el.dataset.barate - Date.now()) / (+el.dataset.tot * 10), 0, 100) + '%'; });
  if (S.view === 'passageiro' && pmap && pmap.ready){
    const r = myRide(); const m = r && motoState(r);
    if (m){
      pmap.marker('moto', m.pos, MK.moto(motoCor(r)), 5);
      const el = $('#etaTxt');
      if (el){ const txt = r.status === 'aceita' ? (m.prog >= 1 ? 'Seu piloto chegou! 🎉' : `Chega em ${fmtRem(m.rem, m.sp)}`) : (m.prog >= 1 ? 'Chegando ao destino…' : `Destino em ${fmtRem(m.rem, m.sp)}`); if (el.textContent !== txt) el.textContent = txt; }
      const gt = $('#gpsTag'); if (gt){ const tx = m.real ? '📡 GPS ao vivo' : '🕒 posição estimada'; if (gt.textContent !== tx) gt.textContent = tx; }
      if (r.demo && m.prog >= 1 && S.advancing !== r.id + r.status){
        S.advancing = r.id + r.status;
        setTimeout(() => { const c = myRide(); if (!c || c.id !== r.id || c.status !== r.status) return;
          Store.update('corridas', r.id, r.status === 'aceita' ? {status:'em_andamento', iniciadaEm:Date.now()} : {status:'concluida', concluidaEm:Date.now()}).catch(() => {}); }, r.status === 'aceita' ? 1800 : 1200);
      }
    } else pmap.marker('moto', null);
  }
  if (S.view === 'piloto' && pilotMap && pilotMap.ready){
    const a = myActive(); const m = a && motoState(a);
    const pos = S.myPos && a && !a.demo ? S.myPos : m && m.pos;
    pilotMap.marker('moto', a ? pos : null, MK.moto(a ? motoCor(a) : '#FFC400'), 5);
    const el = $('#pEtaTxt');
    if (el && m){ const txt = a.status === 'aceita' ? (m.prog >= 1 ? 'Você chegou ao passageiro 📍' : `Passageiro a ${fmtRem(m.rem, m.sp)}`) : (m.prog >= 1 ? 'Chegou ao destino 🏁' : `Destino a ${fmtRem(m.rem, m.sp)}`); if (el.textContent !== txt) el.textContent = txt; }
  }
}

/* ---------- início ---------- */
(async function start(){
  if (MODE === 'google') loadGoogle(CFG.key);
  await Store.init();
  setSync('wait');
  initAuth();
  pmap = makeMap($('#passMap'), {onTap:onPassTap});
  const salvo = LS.get('mtu_center', null);
  try{ await pmap.init(salvo && hav(salvo, CONFIG.CIDADE_PADRAO) < 60000 ? salvo : CFG.center); }
  catch(e){ console.error(e); $('#splash').innerHTML = `<div class="pad" style="text-align:center"><div style="font-size:40px">🗺️</div><h3>Não consegui carregar o Google Maps</h3><p class="muted small mt">Verifique sua conexão e a chave da API.</p><button class="btn mt" data-act="setup">Configurar chave</button></div>`; return; }
  pmap.onIdle(() => { const c = pmap.center(); c && LS.set('mtu_center', c); });
  setupAutocomplete();
  ['empresas','pilotos'].forEach(c => Store.subscribe(c, list => { S[c] = list; S.loaded[c] = true; renderAll(); }));
  Store.subscribe('cidades', list => {
    const primeira = !S.loaded.cidades; S.cidades = list; S.loaded.cidades = true;
    if (primeira && !S.origem && !myRide() && !cidadeDe(pmap.center())){ const c = cidadesAtivas()[0]; if (c){ pmap.panTo(c); } }
    renderAll();
  });
  $('#splash').remove();
  renderAll();
  go(location.hash.slice(1) || S.view);
  requestAnimationFrame(tick);
  try{ const st = navigator.permissions && await navigator.permissions.query({name:'geolocation'});
    if (st && st.state === 'granted'){ const p = await getGps(); if (p && !S.origem && !myRide()){ S.gpsPass = p; pmap.panTo(p); drawPass(); } } }catch(e){}
})();

</script>
